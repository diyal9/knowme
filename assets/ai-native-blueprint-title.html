<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AI Native 落地蓝图</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",-apple-system,sans-serif;}
  html,body{background:#f4f6f8;}
  .stage{width:640px;padding:40px;}
  .card{display:flex;align-items:center;gap:18px;background:#ffffff;border:1px solid #e9edf1;border-radius:14px;padding:20px 24px;box-shadow:0 2px 10px rgba(20,40,60,.05);}
  .badge{flex:none;width:56px;height:56px;border-radius:14px;background:linear-gradient(150deg,#2fae6b 0%,#22935a 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800;letter-spacing:.5px;box-shadow:0 6px 14px rgba(34,147,90,.35);}
  .txt h1{font-size:22px;font-weight:800;color:#1c2b36;line-height:1.3;}
  .txt h1 .native{color:#22935a;}
  .txt p{margin-top:6px;font-size:13.5px;color:#8a99a6;letter-spacing:.5px;}
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <div class="badge">AI</div>
    <div class="txt">
      <h1>AI <span class="native">Native</span> 落地蓝图</h1>
      <p>由浅入深 · 从体验到技术架构</p>
    </div>
  </div>
</div>
</body>
</html>
