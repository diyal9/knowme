<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- KnowMe app icon master: speech/note card + knowledge-graph KM knockout.
       Whole composition scaled 1.5x about its centre (493,479) to fill the tile,
       matching scripts/build-icon-refine.py render_note_fill(scale=1.5). -->
  <rect x="0" y="0" width="1024" height="1024" rx="240" ry="240" fill="#F4EFE7"/>
  <g transform="translate(512,512) scale(1.5) translate(-493,-479)">
    <!-- back card (lighter slate layer) -->
    <rect x="388" y="300" width="398" height="416" rx="74" ry="74" fill="#3A5068"/>
    <!-- ivory moat separating the two layers -->
    <rect x="200" y="216" width="520" height="468" rx="104" ry="104" fill="#F4EFE7"/>
    <polygon points="222,576 222,762 392,628 360,600" fill="#F4EFE7"/>
    <!-- front speech card -->
    <rect x="220" y="236" width="480" height="428" rx="84" ry="84" fill="#172535"/>
    <polygon points="242,596 242,742 360,628" fill="#172535"/>
    <!-- KM in knowledge-graph style (ivory) -->
    <g fill="none" stroke="#F4EFE7" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
      <line x1="310" y1="318" x2="310" y2="602"/>
      <line x1="310" y1="460" x2="415" y2="318"/>
      <line x1="310" y1="460" x2="415" y2="602"/>
      <line x1="475" y1="318" x2="475" y2="602"/>
      <polyline points="475,318 560,505 645,318"/>
      <line x1="645" y1="318" x2="645" y2="602"/>
    </g>
    <g fill="#F4EFE7">
      <circle cx="310" cy="602" r="40"/>
      <circle cx="310" cy="460" r="40"/>
      <circle cx="415" cy="318" r="40"/>
      <circle cx="415" cy="602" r="40"/>
      <circle cx="475" cy="318" r="40"/>
      <circle cx="475" cy="602" r="40"/>
      <circle cx="560" cy="505" r="40"/>
      <circle cx="645" cy="318" r="40"/>
      <circle cx="645" cy="602" r="40"/>
    </g>
    <!-- coral focal node at K top-left terminal -->
    <circle cx="310" cy="318" r="46" fill="#F05D4E"/>
  </g>
</svg>
