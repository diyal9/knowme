<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>飞书权限确认预览</title>
<style>
:root{--ui:system-ui,sans-serif;--text:#1c1917;--text2:#44403c;--text3:#78716c;--line:#e7e5e4;--bg:#fafaf9}
body{margin:0;background:#f5f5f4;font:13px/1.5 var(--ui);color:var(--text);padding:32px}
.card{max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 8px 24px rgba(0,0,0,.04)}
h1{font:600 15px/1.3 var(--ui);margin:0 0 6px}
.intro{color:var(--text3);font-size:12px;margin:0 0 14px}
.connector-scope-list{display:flex;flex-direction:column;gap:8px;margin:0 0 12px;padding:0;list-style:none}
.connector-scope-row{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.connector-scope-row strong{font-weight:600}
.connector-scope-row span{color:var(--text3);font-size:11px}
.missing{border-color:#f59e0b;background:#fffbeb}
.raw{font:450 11px/1.5 ui-monospace,monospace;color:var(--text2);background:#f5f5f4;border-radius:8px;padding:8px 10px;word-break:break-all}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font:600 12px var(--ui);cursor:default}
.btn.primary{background:#1c1917;color:#fff;border-color:#1c1917}
.note{margin-top:16px;color:var(--text3);font-size:11px;text-align:center}
</style></head><body>
<div class="card">
  <h1>补充扩展权限</h1>
  <p class="intro">本轮将向飞书申请以下能力。确认后打开授权页；取消则不做任何变更。</p>
  <ul class="connector-scope-list">
    <li class="connector-scope-row missing"><strong>云盘文件</strong><span>当前缺少</span></li>
    <li class="connector-scope-row missing"><strong>多维表格</strong><span>当前缺少</span></li>
    <li class="connector-scope-row missing"><strong>日程</strong><span>当前缺少</span></li>
    <li class="connector-scope-row"><strong>文档读写</strong><span>已具备</span></li>
    <li class="connector-scope-row"><strong>知识库</strong><span>已具备</span></li>
  </ul>
  <details open><summary style="cursor:pointer;color:#3159d8;font-size:12px">查看原始 scope</summary>
    <div class="raw">drive:drive:readonly, bitable:app:readonly, calendar:calendar:readonly, …</div>
  </details>
  <div class="actions">
    <button class="btn" type="button">取消</button>
    <button class="btn primary" type="button">确认授权</button>
  </div>
</div>
<p class="note">静态预览 · feishu-scope-confirm-and-resume · 制作人验收</p>
</body></html>
