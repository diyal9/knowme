<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Editor Pane</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg-card:#ffffff; --bg-top:#f8f7f4; --bg-mid:#f5f3ef; --div:rgba(0,0,0,0.07);
  --text:#1c1917; --text2:#57534e; --text3:#a8a29e;
  --accent:#3d3a36; --accent-bg:rgba(61,58,54,0.07); --accent-b:rgba(61,58,54,0.18);
  --star:#f59e0b; --green:#16a34a; --amber:#d97706; --red:#dc2626;
  --ui:'Segoe UI Variable','Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Code','JetBrains Mono',Consolas,monospace;
}
html,body { width:100%; height:100%; background:var(--bg-card); overflow:hidden; user-select:none; -webkit-font-smoothing:antialiased; }
.pane { position:relative; width:100%; height:100%; display:flex; flex-direction:column; background:var(--bg-card); }
.pane-empty { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text3); font:13px var(--ui); }
.pane.no-note .workspace, .pane.no-note .head-block { display:none; }
.pane:not(.no-note) .pane-empty { display:none; }

.ico { display:flex; align-items:center; justify-content:center; width:18px; height:18px; flex-shrink:0; pointer-events:none; }
.ico svg { width:100%; height:100%; display:block; }
.ico-sm { width:16px; height:16px; }
.ico-star .s-f { display:none; }
#btnStar.on .ico-star .s-o { display:none; }
#btnStar.on .ico-star .s-f { display:inline; }

.head-block { flex-shrink:0; background:var(--bg-card); border-bottom:1px solid var(--div); padding:6px 12px 7px; display:flex; flex-direction:column; gap:5px; }
.head-line { display:flex; align-items:center; gap:6px; min-width:0; }
.head-tools { display:inline-flex; align-items:center; gap:2px; flex-shrink:0; margin-left:auto; position:relative; }
.head-tool { width:26px; height:26px; padding:0; display:inline-flex; align-items:center; justify-content:center; background:transparent; border:none; border-radius:4px; color:#787878; cursor:pointer; outline:none; }
.head-tool .ico { width:18px; height:18px; }
.head-tool:hover { background:rgba(0,0,0,0.06); color:#222; }
.head-tool.active { background:rgba(0,0,0,0.08); color:#222; }
.head-tool:disabled { opacity:.45; cursor:default; }
.more-menu {
  position:absolute; top:calc(100% + 4px); right:0; z-index:80;
  min-width:200px; display:none; padding:6px; background:var(--bg-card);
  border:1px solid var(--div); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,0.16);
}
.more-menu.show { display:block; }
.more-item {
  width:100%; display:flex; align-items:center; gap:8px; padding:7px 9px;
  border:none; background:transparent; border-radius:7px; cursor:pointer;
  font:500 12px var(--ui); color:var(--text2); text-align:left;
}
.more-item:hover { background:var(--accent-bg); color:var(--text); }
.more-item.active { background:rgba(0,0,0,0.06); color:var(--text); }
.more-item .ico { width:16px; height:16px; color:inherit; }
.more-item .more-check { margin-left:auto; width:14px; height:14px; opacity:0; }
.more-item.active .more-check { opacity:1; }
.more-sep { height:1px; margin:4px 6px; background:var(--div); }
.title-input { flex:1; min-width:0; background:transparent; border:none; outline:none; font:600 14px var(--ui); color:var(--text); letter-spacing:-.1px; cursor:text; user-select:text; -webkit-user-select:text; padding:0; height:26px; }
.title-input::placeholder { color:var(--text3); font-weight:400; font-style:italic; }
.title-input.generating { color:var(--text3); font-style:italic; }
.ver-wrap { flex-shrink:0; display:flex; align-items:center; gap:2px; margin-left:auto; }
.ver-display { display:inline-flex; align-items:center; font:500 10px/1 var(--ui); letter-spacing:.2px; color:var(--accent); background:var(--accent-bg); border:1px solid var(--accent-b); padding:3px 7px; border-radius:5px; cursor:pointer; transition:background .12s; }
.ver-display:hover { background:rgba(61,58,54,0.12); }
.ver-display.hidden { display:none; }
.ver-input { width:52px; background:var(--accent-bg); border:1px solid var(--accent-b); border-radius:5px; padding:3px 6px; font:500 10px/1 var(--ui); color:var(--accent); outline:none; display:none; }
.ver-input.visible { display:inline-block; }
.meta-field { display:flex; align-items:center; gap:4px; min-width:0; }
.meta-field.theme { flex:0 0 auto; max-width:44%; }
.meta-field.tags { flex:1; }
.meta-label { flex-shrink:0; font:500 10px var(--ui); color:var(--text3); letter-spacing:.2px; user-select:none; }
.meta-input { background:transparent; border:1px solid transparent; border-radius:5px; padding:3px 7px; font:11px var(--ui); color:var(--text); outline:none; min-width:0; flex:1; height:24px; user-select:text; -webkit-user-select:text; transition:background .15s, border-color .15s, box-shadow .15s; }
.meta-input:hover { background:rgba(0,0,0,0.03); }
.meta-input:focus { background:var(--bg-top); border-color:var(--accent-b); box-shadow:0 0 0 2px rgba(61,58,54,0.10); }
.meta-input.cat { width:96px; flex:0 0 96px; }
.meta-input.flash { background:var(--bg-top); border-color:var(--accent-b); box-shadow:0 0 0 2px rgba(61,58,54,0.12); }

.pane.ws-shell .ai-pane { display:none !important; }
.pane.ws-shell.ai-open .workspace { flex-direction:column; }
.pane.ws-shell.mode-agent-preview .editor-wrap textarea#editor { visibility:hidden; pointer-events:none; }
.pane.ws-shell.mode-agent-preview .editor-wrap { pointer-events:none; }
.pane.ws-shell.mode-agent-preview .editor-wrap .md-preview { display:block; }

.workspace { flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.editor-pane { flex:1; display:flex; flex-direction:column; min-height:0; min-width:0; }
.pane.ai-open .workspace { flex-direction:row; }

.ai-pane { display:none; flex-direction:column; flex:0 0 38%; min-width:260px; max-width:52%; background:var(--bg-mid); border-right:1px solid rgba(0,0,0,0.10); box-shadow:inset -1px 0 0 rgba(0,0,0,0.02); }
.pane.ai-open .ai-pane { display:flex; }
.ai-pane-head { display:flex; align-items:center; gap:8px; padding:9px 12px; flex-shrink:0; background:var(--bg-top); border-bottom:1px solid var(--div); }
.ai-pane-title { font:600 12px var(--ui); color:var(--text); flex:1; }
.ai-pane-head .ico { color:var(--text2); }
.ai-pane-close { background:transparent; border:none; border-radius:6px; width:26px; height:26px; padding:0; display:flex; align-items:center; justify-content:center; color:var(--text2); cursor:pointer; transition:background .12s, color .12s; }
.ai-pane-close:hover { background:var(--bg-card); color:var(--text); }
.chat-log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; min-height:0; }
.chat-empty { font:12px/1.6 var(--ui); color:var(--text3); text-align:center; padding:28px 12px; }
.chat-bubble { max-width:96%; padding:9px 11px; border-radius:8px; font:12px/1.65 var(--ui); word-break:break-word; user-select:text; -webkit-user-select:text; }
.chat-bubble.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
.chat-bubble.assistant { align-self:flex-start; background:var(--bg-card); border:1px solid var(--div); color:var(--text); border-bottom-left-radius:4px; }
.chat-bubble.loading { color:var(--text3); font-style:italic; border-style:dashed; }
.chat-bubble.thinking {
  color:var(--text3); font-style:italic; border-style:dashed;
  min-height:36px; display:inline-flex; align-items:center;
}
.chat-bubble.thinking.has-execution {
  min-height:0; padding:0; border:0; background:transparent; width:min(560px, 96%);
}
.thinking-status { display:inline-flex; align-items:center; gap:8px; font:12px/1.5 var(--ui); }
.thinking-dots { display:inline-flex; gap:3px; align-items:center; }
.thinking-dots i {
  display:block; width:4px; height:4px; border-radius:50%; background:currentColor;
  opacity:0.3; animation:thinking-bounce 1.2s ease-in-out infinite;
}
.thinking-dots i:nth-child(2) { animation-delay:0.15s; }
.thinking-dots i:nth-child(3) { animation-delay:0.3s; }
@keyframes thinking-bounce {
  0%, 80%, 100% { opacity:0.25; transform:translateY(0); }
  40% { opacity:1; transform:translateY(-2px); }
}
.chat-execution { width:100%; margin:0 0 10px; border:0; background:transparent; overflow:hidden; font-style:normal; }
.chat-bubble.thinking .chat-execution { margin:0; }
.chat-execution-summary { display:flex; align-items:center; gap:8px; cursor:pointer; list-style:none; padding:2px 0 8px; color:var(--text); font:600 12px/1.45 var(--ui); }
.chat-execution-summary::-webkit-details-marker { display:none; }
.chat-execution-summary::after { content:'›'; margin-left:auto; color:var(--text3); font-size:15px; transition:transform .15s ease; }
.chat-execution[open] > .chat-execution-summary::after { transform:rotate(90deg); }
.chat-execution-orb { width:18px; height:18px; flex:0 0 18px; border-radius:50%; background:#343746; box-shadow:inset 0 0 0 5px #e9eaf0; animation:orb-breathe 1.4s ease-in-out infinite; }
.chat-execution-list { display:flex; flex-direction:column; gap:1px; max-height:176px; overflow-y:auto; margin-left:8px; padding:0 8px 8px 15px; border-left:3px solid #ececeb; scrollbar-width:thin; }
.trace-row { display:grid; grid-template-columns:16px minmax(0,1fr) auto; align-items:center; gap:6px; min-height:27px; color:var(--text2); font:11.5px/1.45 var(--ui); }
.trace-mark { display:flex; width:14px; height:14px; align-items:center; justify-content:center; color:var(--accent); font-weight:700; }
.trace-row.error .trace-mark { color:#dc2626; }
.trace-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.trace-time { color:var(--text3); font-size:10px; }
.trace-pulse { display:inline-block; width:7px; height:7px; border-radius:50%; background:#4d8a78; box-shadow:0 0 0 0 rgba(77,138,120,.3); animation:trace-pulse 1.2s ease-out infinite; }
@keyframes trace-pulse { 70%,100% { box-shadow:0 0 0 6px rgba(77,138,120,0); } }
@keyframes orb-breathe { 50% { opacity:.62; transform:scale(.92); } }
.chat-text.md { display:block; }
.chat-text.md > *:first-child { margin-top:0; }
.chat-text.md > *:last-child { margin-bottom:0; }
.chat-text.md p { margin:0 0 7px; }
.chat-text.md .md-h { font-weight:600; line-height:1.4; margin:10px 0 5px; color:var(--text); }
.chat-text.md h1.md-h { font-size:14px; } .chat-text.md h2.md-h { font-size:13px; } .chat-text.md h3.md-h,.chat-text.md h4.md-h { font-size:12px; }
.chat-text.md ul,.chat-text.md ol { margin:0 0 7px; padding-left:18px; }
.chat-text.md li { margin:2px 0; }
.chat-text.md strong { font-weight:600; color:var(--text); }
.chat-text.md em { font-style:italic; }
.chat-text.md code { font:11px var(--mono); background:rgba(0,0,0,0.06); padding:1px 4px; border-radius:4px; word-break:break-word; }
.chat-text.md pre { margin:0 0 7px; padding:8px 10px; border-radius:6px; background:var(--bg-mid); border:1px solid var(--div); overflow-x:auto; }
.chat-text.md pre code { display:block; background:none; padding:0; font:11px/1.6 var(--mono); white-space:pre; }
.chat-text.md .chat-inline-image-wrap { margin:6px 0 9px; }
.chat-text.md .chat-inline-image {
  display:block; max-width:min(100%, 520px); max-height:320px; border-radius:8px;
  border:1px solid rgba(0,0,0,.1); object-fit:contain; background:#fff; cursor:zoom-in;
}
.chat-text.md .chat-inline-image:hover { border-color:var(--accent-b); box-shadow:0 2px 12px rgba(0,0,0,.1); }
.chat-bubble.streaming .stream-cursor { display:inline-block; margin-left:1px; color:var(--accent); animation:stream-blink 0.9s step-end infinite; }
@keyframes stream-blink { 50% { opacity:0; } }
.chat-bubble.err { border-color:rgba(220,38,38,0.25); background:rgba(220,38,38,0.05); color:var(--red); }
.chat-actions { display:flex; gap:6px; margin-top:10px; padding-top:8px; border-top:1px solid rgba(0,0,0,0.06); flex-wrap:wrap; }
.chat-act { display:inline-flex; align-items:center; gap:4px; font:500 11px var(--ui); color:var(--accent); background:transparent; border:1px solid var(--accent-b); border-radius:999px; padding:4px 11px; cursor:pointer; transition:background .12s, border-color .12s, color .12s, transform .1s; outline:none; user-select:none; }
.chat-act:hover { background:var(--accent-bg); border-color:var(--accent); }
.chat-act:active { transform:scale(.97); }
.chat-act.subtle { color:var(--text2); border-color:rgba(0,0,0,0.12); }
.chat-act.subtle:hover { color:var(--accent); border-color:var(--accent-b); background:var(--accent-bg); }
.ai-pane-foot { flex-shrink:0; padding:10px 12px 12px; border-top:1px solid var(--div); background:var(--bg-top); display:flex; flex-direction:column; gap:8px; }

.editor-wrap { flex:1; position:relative; overflow:hidden; }
textarea#editor { position:absolute; inset:0; width:100%; height:100%; padding:18px 26px 14px; background:transparent; border:none; outline:none; resize:none; font:13.5px/1.95 var(--mono); color:var(--text); caret-color:var(--accent); user-select:text; -webkit-user-select:text; overflow-y:auto; letter-spacing:.01em; }
textarea#editor::placeholder { font:13.5px/1.7 var(--ui); font-style:italic; color:var(--text3); }
.editor-wrap.preview-mode textarea#editor { visibility:hidden; pointer-events:none; }
.md-preview { display:none; position:absolute; inset:0; padding:18px 26px 14px; overflow-y:auto; font:14px/1.8 var(--ui); color:var(--text); user-select:text; -webkit-user-select:text; }
.editor-wrap.preview-mode .md-preview { display:block; }
.md-preview h1,.md-preview h2,.md-preview h3 { font-weight:600; color:var(--text); margin:.6em 0 .35em; line-height:1.3; }
.md-preview h1 { font-size:1.35em; } .md-preview h2 { font-size:1.15em; } .md-preview h3 { font-size:1.05em; }
.md-preview p { margin:.45em 0; }
.md-preview strong { font-weight:600; color:var(--text); }
.md-preview em { font-style:italic; }
.md-preview a { color:var(--accent); text-decoration:none; }
.md-preview a:hover { text-decoration:underline; }
.md-preview code { font:12px/1.5 var(--mono); background:var(--bg-top); padding:1px 5px; border-radius:4px; color:var(--text); }
.md-preview pre { background:var(--bg-top); border:1px solid var(--div); border-radius:8px; padding:10px 12px; margin:.5em 0; overflow-x:auto; }
.md-preview pre code { background:transparent; padding:0; font-size:12px; }
.md-preview blockquote { margin:.5em 0; padding:2px 0 2px 12px; border-left:3px solid var(--accent-b); color:var(--text2); }
.md-preview ul,.md-preview ol { margin:.45em 0; padding-left:1.4em; }
.md-preview li { margin:.2em 0; }
.md-preview hr { border:none; border-top:1px solid var(--div); margin:1em 0; }
.md-preview table { border-collapse:collapse; width:100%; margin:.5em 0; font-size:12px; }
.md-preview th,.md-preview td { border:1px solid var(--div); padding:5px 8px; text-align:left; }
.md-preview th { background:var(--bg-top); font-weight:600; }
.md-preview img {
  display:block; max-width:min(100%, 720px); max-height:460px; margin:.55em 0;
  border:1px solid rgba(0,0,0,.1); border-radius:10px; object-fit:contain; background:#fff; cursor:zoom-in;
}
.caret-mirror { position:absolute; visibility:hidden; white-space:pre-wrap; word-wrap:break-word; overflow:hidden; pointer-events:none; z-index:-1; font:13.5px/1.95 var(--mono); padding:18px 26px 14px; }
.image-viewer {
  position:fixed; inset:0; z-index:280; display:none; align-items:center; justify-content:center;
  padding:26px; background:rgba(0,0,0,.7);
}
.image-viewer.show { display:flex; }
.image-viewer img {
  max-width:min(92vw, 1320px); max-height:90vh; border-radius:12px; box-shadow:0 20px 70px rgba(0,0,0,.35);
  object-fit:contain; background:rgba(255,255,255,.96);
}
.image-viewer-close {
  position:absolute; top:10px; right:12px; width:34px; height:34px; border:0; border-radius:999px;
  background:rgba(255,255,255,.16); color:#fff; font:500 20px/1 var(--ui); cursor:pointer;
}
.image-viewer-close:hover { background:rgba(255,255,255,.28); }
.md-slash-menu { position:fixed; z-index:120; display:none; min-width:220px; max-width:260px; max-height:320px; overflow-y:auto; padding:6px; background:var(--bg-card); border:1px solid var(--div); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,0.16); }
.md-slash-menu.show { display:block; }
.md-slash-menu .slash-group { padding:5px 8px 3px; font:600 10px var(--ui); color:var(--text3); }
.md-slash-menu .slash-item { width:100%; border:none; background:transparent; border-radius:7px; display:flex; flex-direction:row; align-items:center; gap:8px; text-align:left; justify-content:flex-start; padding:6px 8px; cursor:pointer; font:500 11px var(--ui); color:var(--text2); line-height:1.25; }
.md-slash-menu .slash-item:hover,.md-slash-menu .slash-item.active { background:var(--accent-bg); color:var(--text); }
.md-slash-menu .slash-item .ico { color:#4f6ef7; }
.md-slash-menu .slash-item .ico svg { width:14px; height:14px; }
.md-slash-menu .slash-label { flex:1; text-align:left; }
.sel-bubble { position:fixed; z-index:130; display:none; padding:3px 4px; gap:2px; background:var(--bg-card); border:1px solid var(--div); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.14); }
.sel-bubble.show { display:flex; }
.sel-bubble button { width:26px; height:26px; border:none; background:transparent; border-radius:5px; color:var(--text2); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s, color .12s; outline:none; }
.sel-bubble button:hover { background:var(--accent-bg); color:var(--accent); }
.sel-bubble button .ico svg { width:14px; height:14px; }

.var-bar { display:none; padding:5px 13px; background:rgba(61,58,54,0.05); border-top:1px solid rgba(61,58,54,0.10); flex-shrink:0; }
.var-bar.visible { display:flex; align-items:center; gap:5px; }
.var-bar-label { font:11px var(--ui); color:var(--text3); flex-shrink:0; }
.var-chips { display:flex; flex-wrap:wrap; gap:4px; flex:1; min-width:0; }
.var-chip { font:500 10px var(--ui); color:var(--text2); background:rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.08); padding:2px 7px; border-radius:6px; white-space:nowrap; }

.footer {
  display:flex; align-items:center; padding:4px 12px; gap:0; min-height:28px;
  background:var(--bg-top); border-top:1px solid var(--div); flex-shrink:0;
}
.footer-meta {
  flex:1; display:flex; align-items:center; gap:0; min-width:0; overflow:hidden;
  font:12px var(--ui); color:var(--text3); flex-wrap:nowrap;
}
.footer-meta .save-time { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stat-star {
  width:22px; height:22px; flex-shrink:0; padding:0; margin-right:2px;
  display:inline-flex; align-items:center; justify-content:center;
  background:transparent; border:none; border-radius:4px; color:var(--text3); cursor:pointer; outline:none;
}
.stat-star .ico { width:14px; height:14px; }
.stat-star:hover { background:rgba(0,0,0,0.05); color:var(--star); }
.stat-star.on { color:var(--star); }
.stat-star.on:hover { background:rgba(245,158,11,0.12); }
.stat-sep { color:var(--text3); opacity:.55; padding:0 7px; flex-shrink:0; user-select:none; }
.stat-item { flex-shrink:0; white-space:nowrap; color:var(--text3); }
.stat-item.edit-ico { display:inline-flex; align-items:center; color:var(--text3); opacity:.7; }
.stat-item.edit-ico .ico { width:13px; height:13px; }
.save-time { font:inherit; color:inherit; transition:color .3s; }
.footer-meta.dirty .save-time { color:var(--amber); }
.footer-meta.saved .save-time { color:var(--green); }
.token-est { font:inherit; color:inherit; padding-left:7px; }
.token-est:empty { display:none; padding:0; }

.ai-composer-shell { position:relative; display:flex; flex-direction:column; gap:4px; background:var(--bg-card); border:1px solid rgba(0,0,0,0.10); border-radius:12px; padding:6px 6px 5px; min-height:72px; transition:border-color .14s, box-shadow .14s; }
.ai-composer-shell:focus-within { border-color:rgba(61,58,54,0.34); box-shadow:0 0 0 3px rgba(61,58,54,0.07); }
.ai-toolbar { display:flex; align-items:center; gap:4px; }
.ai-menu-wrap { position:relative; flex-shrink:0; }
.ai-action-btn { height:24px; display:inline-flex; align-items:center; gap:5px; background:transparent; border:none; border-radius:7px; padding:0 8px; color:var(--text2); cursor:pointer; font:500 10px var(--ui); white-space:nowrap; transition:background .12s, color .12s; }
.ai-action-btn:hover { background:rgba(0,0,0,0.05); color:var(--text); }
.ai-action-btn .chev { transform:rotate(90deg); opacity:.9; }
.ai-menu { position:absolute; left:0; bottom:36px; z-index:45; min-width:184px; display:block; padding:5px; opacity:0; visibility:hidden; pointer-events:none; transform:translateY(6px) scale(.98); transform-origin:left bottom; background:var(--bg-card); border:1px solid var(--div); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,0.16); transition:opacity .14s ease, transform .16s ease, visibility 0s linear .16s; }
.ai-menu.quick-menu { min-width:188px; width:max-content; max-width:260px; padding:3px; }
.ai-menu.show { opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0) scale(1); transition-delay:0s; }
.ai-menu-item { width:100%; border:none; background:transparent; border-radius:7px; display:flex; align-items:center; gap:6px; text-align:left; padding:7px 9px; cursor:pointer; font:500 11px var(--ui); color:var(--text2); }
.ai-menu-item:hover,.ai-menu-item.active { background:var(--accent-bg); color:var(--text); }
.ai-menu-item.danger:hover { background:rgba(220,38,38,0.08); color:var(--red); }
.ai-menu-item .ico { color:inherit; }
.ai-menu.quick-menu .ai-menu-item { padding:5px 6px; font-size:10px; gap:5px; }
.ai-menu.quick-menu .ai-menu-item .ico { width:12px; height:12px; }
.ai-menu.quick-menu .ai-menu-item .ico svg { width:12px; height:12px; }
@media (prefers-reduced-motion: reduce) { .ai-menu { transition:none; transform:none; } }
.ai-input-wrap { position:relative; width:100%; min-width:0; display:flex; align-items:flex-end; }
textarea#aiInput { flex:1; width:100%; background:transparent; border:none; border-radius:8px; padding:4px 8px 2px; min-height:34px; max-height:96px; font:12px/1.45 var(--ui); color:var(--text); outline:none; caret-color:var(--accent); resize:none; user-select:text; -webkit-user-select:text; }
textarea#aiInput::placeholder { color:var(--text3); }
.ai-go { width:24px; height:24px; background:transparent; border:none; border-radius:6px; color:var(--text2); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:background .12s, color .12s; outline:none; }
.ai-go:hover { background:rgba(0,0,0,0.05); color:var(--text); }
.ai-go:active { transform:scale(.92); }
.ai-go:disabled { opacity:.4; cursor:default; }
.ai-go .ico { width:16px; height:16px; }
.slash-menu { display:none; position:absolute; left:0; right:36px; bottom:100%; margin-bottom:6px; max-height:200px; overflow:auto; z-index:40; background:var(--bg-card); border:1px solid var(--div); border-radius:10px; box-shadow:0 8px 28px rgba(0,0,0,0.12); }
.slash-menu.show { display:block; }
.slash-item { display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; padding:8px 10px; border:none; background:transparent; cursor:pointer; font:12px var(--ui); color:var(--text); border-bottom:1px solid var(--div); }
.slash-item:last-child { border-bottom:none; }
.slash-item:hover,.slash-item.active { background:var(--accent-bg); }
.slash-item .slash-cmd { font:600 12px var(--mono); color:var(--accent); }
.slash-item .slash-title { font:11px var(--ui); color:var(--text2); }
.slash-empty { padding:10px 12px; font:11px var(--ui); color:var(--text3); }

::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb {
  background:rgba(61,58,54,0.24);
  border-radius:999px;
  border:3px solid transparent;
  background-clip:padding-box;
}
::-webkit-scrollbar-thumb:hover { background:rgba(61,58,54,0.36); }

.toast-wrap { position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(8px); opacity:0; pointer-events:none; z-index:300; transition:opacity .18s, transform .18s; }
.toast-wrap.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast { background:#1c1917; color:#fff; font:500 12px var(--ui); padding:8px 14px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.18); max-width:min(92vw,360px); text-align:center; }
.toast-wrap.error .toast { background:#7f1d1d; }
.toast-wrap.success .toast { background:#14532d; }
</style>
</head>
<body>
<div class="pane no-note" id="pane">
  <div class="pane-empty">KnowMe(知我) ·&nbsp;&nbsp;&nbsp;懂你的智能体搭档</div>
  <div class="head-block">
    <div class="head-line">
      <input class="title-input" id="inpProject" placeholder="文件标题…" maxlength="40" spellcheck="false" title="文件名，显示在标签页与项目树">
      <div class="head-tools" role="group" aria-label="视图与更多">
        <button class="head-tool" id="btnReadingView" type="button" title="阅读视图" aria-label="阅读视图" aria-pressed="false">
          <span class="ico ico-sm" data-icon="bookOpen"></span>
        </button>
        <button class="head-tool" id="btnMore" type="button" title="更多" aria-label="更多" aria-haspopup="menu" aria-expanded="false">
          <span class="ico ico-sm" data-icon="moreVertical"></span>
        </button>
        <div class="more-menu" id="moreMenu" role="menu" aria-label="文档更多操作">
          <button class="more-item" type="button" role="menuitem" data-act="reading"><span class="ico" data-icon="bookOpen"></span><span>阅读视图</span><span class="ico more-check" data-icon="check"></span></button>
          <button class="more-item" type="button" role="menuitem" data-act="source"><span class="ico" data-icon="code"></span><span>源码模式</span><span class="ico more-check" data-icon="check"></span></button>
          <button class="more-item" type="button" role="menuitem" data-act="plain"><span class="ico" data-icon="note"></span><span>文本模式</span><span class="ico more-check" data-icon="check"></span></button>
          <div class="more-sep"></div>
          <button class="more-item" type="button" role="menuitem" data-act="versions"><span class="ico" data-icon="history"></span><span>版本对比</span></button>
          <button class="more-item" type="button" role="menuitem" data-act="final-prompt"><span class="ico" data-icon="eye"></span><span>最终提示词预览</span></button>
          <div class="more-sep"></div>
          <button class="more-item" type="button" role="menuitem" data-act="favorite" id="menuFavorite"><span class="ico ico-star" data-icon="star"></span><span>收藏</span><span class="ico more-check" data-icon="check"></span></button>
        </div>
      </div>
    </div>
    <div class="head-line">
      <label class="meta-field theme">
        <span class="meta-label">项目</span>
        <input class="meta-input cat" id="inpCategory" placeholder="未分类" maxlength="32" spellcheck="false" title="所属项目/工作区，左侧按此分组">
      </label>
      <label class="meta-field tags">
        <span class="meta-label">标签</span>
        <input class="meta-input" id="inpOkfTags" placeholder="逗号分隔，便于检索" spellcheck="false">
      </label>
      <div class="ver-wrap">
        <span class="ver-display" id="verDisplay" title="点击修改版本号">v0.1</span>
        <input class="ver-input" id="verInput" maxlength="12" spellcheck="false">
      </div>
    </div>
  </div>
  <div class="workspace" id="workspace">
    <aside class="ai-pane" id="aiPane">
      <div class="ai-pane-head">
        <span class="ico" data-icon="chat"></span>
        <span class="ai-pane-title">助手</span>
        <button class="ai-pane-close" id="aiClose" type="button" title="收起助手"><span class="ico ico-sm" data-icon="chevronLeft"></span></button>
      </div>
      <div class="chat-log" id="chatLog"><div class="chat-empty">描述需求，助手帮你写</div></div>
      <div class="ai-pane-foot">
        <div class="ai-composer-shell" id="aiComposer">
          <div class="ai-input-wrap">
            <div class="slash-menu" id="slashMenu" role="listbox" aria-label="片段快捷引用"></div>
            <textarea id="aiInput" rows="2" placeholder="描述需求… 输入 / 引用片段" spellcheck="false"></textarea>
          </div>
          <div class="ai-toolbar">
            <div class="ai-menu-wrap">
              <button class="ai-action-btn" id="aiQuickBtn" type="button" title="快捷（Ctrl+K）" aria-expanded="false" aria-controls="aiQuickMenu">
                <span class="ico ico-sm" data-icon="optimize"></span><span>快捷</span>
                <span class="ico ico-sm chev" data-icon="chevronRight"></span>
              </button>
              <div class="ai-menu quick-menu" id="aiQuickMenu" role="menu" aria-label="快捷操作" aria-hidden="true">
                <button class="ai-menu-item" type="button" role="menuitem" data-p="请作为飞书协同沟通助手，基于当前上下文起草一条可直接发送的消息；给出正式版和简洁版各一条，并标注适用对象。"><span class="ico ico-sm" data-icon="expandText"></span><span>飞书沟通</span></button>
                <button class="ai-menu-item" type="button" role="menuitem" data-p="请执行飞书文档读写流程：先搜索并读取相关文档，再输出可回写的文档草稿（标题、正文、待确认项）。"><span class="ico ico-sm" data-icon="note"></span><span>文档读写</span></button>
                <button class="ai-menu-item" type="button" role="menuitem" data-p="请走飞书知识体系流程：先定位知识库空间与节点，再给出结论、证据来源和可落表的数据结构建议。"><span class="ico ico-sm" data-icon="list"></span><span>知识库检索</span></button>
                <button class="ai-menu-item" type="button" role="menuitem" data-p="请处理飞书会议体系：整理会议纪要，输出议题、结论、行动项、负责人、时间点和风险提醒。优先使用已注册的飞书只读工具（搜索文档/读取文档）获取原文后再总结。"><span class="ico ico-sm" data-icon="check"></span><span>会议记录</span></button>
                <button class="ai-menu-item" type="button" role="menuitem" data-p="请联动飞书日程与任务：给出今天到本周的日程安排、未完成任务、优先级重排建议和下一步执行清单。"><span class="ico ico-sm" data-icon="optimize"></span><span>日程任务</span></button>
                <button class="ai-menu-item" type="button" role="menuitem" data-p="请按飞书组织协同场景处理：先明确对象与目标，再给出审批、OKR对齐和邮件沟通建议。"><span class="ico ico-sm" data-icon="list"></span><span>组织协同</span></button>
              </div>
            </div>
            <div style="flex:1"></div>
            <button class="ai-go in-shell" id="aiSend" title="发送" type="button"><span class="ico ico-sm" data-icon="send"></span></button>
            <div class="ai-menu-wrap">
              <button class="ai-go" id="aiMoreBtn" title="更多操作" type="button" aria-label="更多操作"><span class="ico ico-sm" data-icon="list"></span></button>
              <div class="ai-menu" id="aiMoreMenu" style="left:auto; right:0;">
                <button class="ai-menu-item danger" type="button" id="aiClearChat">清空对话</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <section class="editor-pane">
      <div class="editor-wrap" id="editorWrap">
        <textarea id="editor" placeholder="在此编写…  支持 Markdown，可用 {{变量名}} 占位"></textarea>
        <div class="md-preview" id="previewPane"></div>
        <div class="caret-mirror" id="caretMirror" aria-hidden="true"></div>
      </div>
      <div class="var-bar" id="varBar"><span class="var-bar-label">变量</span><div class="var-chips" id="varChips"></div></div>
      <div class="footer" aria-label="文档状态">
        <div class="footer-meta" id="footerMeta">
          <button class="stat-star" id="btnStar" type="button" title="收藏" aria-label="收藏"><span class="ico ico-star" id="icoStar" data-icon="star"></span></button>
          <span class="stat-sep">·</span>
          <span class="save-time stat-item" id="saveTime">—</span>
          <span class="stat-sep">·</span>
          <span class="stat-item edit-ico" id="editModeIco" title="编辑中"><span class="ico" data-icon="edit"></span></span>
          <span class="stat-sep">·</span>
          <span class="stat-item" id="wordCnt">0 个词</span>
          <span class="stat-sep">·</span>
          <span class="stat-item" id="cnt">0 个字符</span>
          <span class="token-est stat-item" id="tokenEst"></span>
        </div>
      </div>
    </section>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"><div class="toast" id="toast"></div></div>
<div class="md-slash-menu" id="mdSlashMenu"></div>
<div class="sel-bubble" id="selBubble">
  <button type="button" data-md="bold" title="加粗"><span class="ico ico-sm" data-icon="bold"></span></button>
  <button type="button" data-md="italic" title="斜体"><span class="ico ico-sm" data-icon="italic"></span></button>
  <button type="button" data-md="code" title="行内代码"><span class="ico ico-sm" data-icon="code"></span></button>
  <button type="button" data-md="strike" title="删除线"><span class="ico ico-sm" data-icon="strikethrough"></span></button>
  <button type="button" data-md="link" title="链接"><span class="ico ico-sm" data-icon="link"></span></button>
</div>
<div class="image-viewer" id="chatImageViewer" aria-hidden="true">
  <button type="button" class="image-viewer-close" id="chatImageViewerClose" aria-label="关闭预览">×</button>
  <img id="chatImageViewerImg" alt="图片预览">
</div>

<script src="ui-icons.js?v=lucide4"></script>
<script src="assets/vendor/marked.umd.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script src="lib/ui-kit.js?v=1"></script>
<script src="lib/markdown-lite.js?v=1"></script>
<script src="editor-pane.js?v=uikit1"></script>
</body>
</html>
