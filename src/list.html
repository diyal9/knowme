<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Sticky-Notes — 所有提示词</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-card:#ffffff;--bg-top:#f8f7f4;--bg-mid:#f5f3ef;--bg-deep:#efecea;
  --div:rgba(0,0,0,0.07);
  --text:#1c1917;--text2:#6b6560;--text3:#b0a89e;
  --accent:#5558e8;--accent-bg:rgba(85,88,232,0.07);--accent-b:rgba(85,88,232,0.20);
  --star:#f59e0b;--green:#16a34a;--red:#dc2626;
  --r:16px;--ui:'Segoe UI Variable','Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Code','JetBrains Mono',Consolas,monospace;
}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased;}

.panel{
  width:100%;height:100%;display:flex;flex-direction:column;
  background:var(--bg-card);border-radius:var(--r);
  border:1px solid rgba(0,0,0,0.09);
  box-shadow:0 1px 0 rgba(255,255,255,0.9) inset,0 6px 20px rgba(0,0,0,0.08),0 28px 64px rgba(0,0,0,0.07);
  overflow:hidden;animation:appear .18s cubic-bezier(.34,1.15,.64,1);
}

/* 顶栏 */
.header{height:44px;display:flex;align-items:center;padding:0 12px;gap:8px;background:var(--bg-top);border-bottom:1px solid var(--div);-webkit-app-region:drag;flex-shrink:0;}
.header-brand{font:600 11px var(--ui);letter-spacing:.2px;color:var(--text2);flex:1;}
.header-count{font:11px var(--ui);color:var(--text3);}
.hbtn{width:22px;height:22px;background:transparent;border:none;border-radius:6px;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;outline:none;-webkit-app-region:no-drag;}
.hbtn .ico{display:flex;width:14px;height:14px;}
.hbtn .ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
.hbtn:hover{background:rgba(0,0,0,0.07);color:var(--text2);}
.hbtn.del:hover{background:rgba(220,38,38,0.10);color:var(--red);}

/* 搜索 + 筛选 */
.search-area{padding:8px 12px 6px;border-bottom:1px solid var(--div);background:var(--bg-card);flex-shrink:0;}
.search-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
input#search{
  flex:1;background:var(--bg-top);border:1px solid rgba(0,0,0,0.09);border-radius:8px;
  padding:7px 12px;font:12px var(--ui);color:var(--text);outline:none;caret-color:var(--accent);
  transition:border-color .14s,box-shadow .14s;user-select:text;-webkit-user-select:text;
}
input#search::placeholder{color:var(--text3);}
input#search:focus{border-color:rgba(85,88,232,0.35);box-shadow:0 0 0 3px rgba(85,88,232,0.07);}

.filter-row{display:flex;gap:5px;}
.filter-btn{
  background:transparent;border:1px solid rgba(0,0,0,0.10);border-radius:20px;
  padding:3px 10px;font:500 11px var(--ui);color:var(--text3);cursor:pointer;
  transition:all .12s;outline:none;
}
.filter-btn.active{background:var(--accent-bg);border-color:var(--accent-b);color:var(--accent);}
.filter-btn.fav.active{background:rgba(245,158,11,0.08);border-color:rgba(245,158,11,0.25);color:var(--star);}
.filter-btn:hover:not(.active){background:var(--bg-top);}

/* 列表 */
.list-wrap{flex:1;overflow-y:auto;padding:4px 0;}
.card-row{
  padding:9px 13px;border-bottom:1px solid rgba(0,0,0,0.04);
  cursor:pointer;transition:background .10s;display:flex;gap:8px;align-items:flex-start;
}
.card-row:hover{background:rgba(0,0,0,0.02);}
.card-row:active{background:var(--accent-bg);}
.card-row:last-child{border-bottom:none;}
.row-star{font:12px var(--ui);color:var(--text3);padding-top:1px;flex-shrink:0;transition:color .12s;}
.card-row.is-fav .row-star{color:var(--star);}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.row-meta{display:flex;align-items:center;gap:5px;}
.row-name{font:600 12px var(--ui);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.row-ver{font:600 9px var(--ui);color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-b);padding:1px 5px;border-radius:20px;flex-shrink:0;}
.row-meta2{display:flex;align-items:center;gap:5px;}
.row-time{font:10px var(--ui);color:var(--text3);}
.row-copy{font:10px var(--ui);color:var(--text3);}
.row-group{font:10px var(--ui);color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;}
.row-preview{font:11.5px/1.55 var(--mono);color:var(--text2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:pre-wrap;}
.row-preview.empty{font:italic 11px var(--ui);color:var(--text3);}

.empty-state{padding:40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
.empty-state .icon{display:flex;align-items:center;justify-content:center;width:32px;height:32px;color:var(--text3);}
.empty-state .icon svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5;}
.empty-state .msg{font:italic 12px var(--ui);color:var(--text3);}

/* 底栏 */
.footer-bar{
  border-top:1px solid var(--div);padding:7px 12px;
  background:var(--bg-top);flex-shrink:0;
  display:flex;align-items:center;gap:8px;
}
.footer-bar-text{font:10px var(--ui);color:var(--text3);flex:1;}
.btn-new-full{
  background:transparent;border:1px solid rgba(0,0,0,0.13);border-radius:7px;
  padding:6px 14px;font:500 11px var(--ui);color:var(--text2);cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;outline:none;
}
.btn-new-full:hover{background:var(--bg-mid);border-color:rgba(0,0,0,0.18);color:var(--text);}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.10);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:rgba(85,88,232,0.25);}
@keyframes appear{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <span class="header-brand">Sticky-Notes</span>
    <span class="header-count" id="hCount">—</span>
    <button class="hbtn del" id="btnClose" title="关闭"><span class="ico" data-icon="close"></span></button>
  </div>
  <div class="search-area">
    <div class="search-row">
      <input id="search" placeholder="搜索提示词名称或内容…" spellcheck="false">
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-sort="recent">最近</button>
      <button class="filter-btn fav"    data-sort="fav">★ 收藏</button>
      <button class="filter-btn"        data-sort="most">最多复制</button>
    </div>
  </div>
  <div class="list-wrap" id="listWrap"></div>
  <div class="footer-bar">
    <span class="footer-bar-text">双击托盘 · Ctrl+Alt+L · Esc 关闭</span>
    <button class="btn-new-full" id="btnNew">＋ 新建</button>
  </div>
</div>
<script src="ui-icons.js"></script>
<script>
StickyIcons.mount()
let allNotes=[], currentSort='recent', searchQ=''

function relTime(iso){if(!iso)return'—';const s=(Date.now()-new Date(iso))/1000;if(s<60)return`${Math.floor(s)}s前`;if(s<3600)return`${Math.floor(s/60)}m前`;if(s<86400)return`${Math.floor(s/3600)}h前`;return`${Math.floor(s/86400)}d前`}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function getSorted(notes) {
  let arr = notes.slice()
  if (searchQ) arr=arr.filter(n=>n.project?.toLowerCase().includes(searchQ)||n.content?.toLowerCase().includes(searchQ)||n.version?.includes(searchQ)||n.promptGroup?.toLowerCase().includes(searchQ)||n.sourceRelPath?.toLowerCase().includes(searchQ))
  if (currentSort==='fav')    return arr.filter(n=>n.favorite).sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0))
  if (currentSort==='most')   return arr.sort((a,b)=>(b.copyCount||0)-(a.copyCount||0))
  // recent: favorites at top, then by date
  return arr.sort((a,b)=>{
    if(a.favorite&&!b.favorite)return-1
    if(!a.favorite&&b.favorite)return 1
    return new Date(b.updatedAt||0)-new Date(a.updatedAt||0)
  })
}

function render() {
  const wrap=document.getElementById('listWrap')
  const notes=getSorted(allNotes)
  document.getElementById('hCount').textContent=`${notes.length} 个`
  if(!notes.length){
    const isSearch = currentSort==='fav'?'没有收藏的提示词':'没有找到匹配结果'
    wrap.innerHTML=`<div class="empty-state"><span class="icon" data-icon="note"></span><span class="msg">${isSearch}</span></div>`
    StickyIcons.mount(wrap)
    return
  }
  wrap.innerHTML=notes.map(n=>{
    const name=n.project?.trim()||'未命名',ver=n.version||'0.1',preview=n.content?.trim()||''
    const copies=n.copyCount>0?`<span class="row-copy">复制 ${n.copyCount}×</span>`:''
    const group=n.promptGroup?`<span class="row-group">${esc(n.promptGroup)}</span>`:''
    return`<div class="card-row${n.favorite?' is-fav':''}" data-id="${n.id}">
      <span class="row-star">${n.favorite?'★':'☆'}</span>
      <div class="row-body">
        <div class="row-meta">
          <span class="row-name">${esc(name)}</span>
          <span class="row-ver">v${esc(ver)}</span>
        </div>
        <div class="row-meta2">
          <span class="row-time">${relTime(n.updatedAt||n.createdAt)}</span>
          ${group}
          ${copies}
        </div>
        <div class="row-preview${!preview?' empty':''}">${!preview?'(空)':esc(preview.substring(0,100))}</div>
      </div>
    </div>`
  }).join('')
  wrap.querySelectorAll('.card-row').forEach(r=>{
    const open = () => window.api.focusNote(r.dataset.id)
    r.addEventListener('click', open)
    r.addEventListener('dblclick', open)
  })
}

// 筛选切换
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'))
    btn.classList.add('active'); currentSort=btn.dataset.sort; render()
  })
})

document.getElementById('search').addEventListener('input',e=>{ searchQ=e.target.value.trim().toLowerCase(); render() })
document.getElementById('search').addEventListener('keydown',e=>{ if(e.key==='Escape'){document.getElementById('search').value='';searchQ='';render()} })
window.api.initList(notes=>{allNotes=notes;render()})
document.getElementById('btnNew').addEventListener('click',()=>window.api.newNote())
document.getElementById('btnClose').addEventListener('click',()=>window.api.closeList())
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.api.closeList()})
setInterval(render,60000)
</script>
</body>
</html>
