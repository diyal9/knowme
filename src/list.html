<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Sticky-Notes — 所有提示词</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-card:#ffffff;--bg-top:#f8f7f4;--bg-mid:#f5f3ef;--bg-deep:#efecea;--bg-rail:#f7f6f3;
  --div:rgba(0,0,0,0.07);
  --text:#1c1917;--text2:#57534e;--text3:#a8a29e;
  --accent:#5558e8;--accent-bg:rgba(85,88,232,0.07);--accent-b:rgba(85,88,232,0.18);
  --star:#f59e0b;--red:#dc2626;
  --r:16px;--ui:'Segoe UI Variable','Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Code','JetBrains Mono',Consolas,monospace;
}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased;}

.panel{
  width:100%;height:100%;display:flex;flex-direction:column;
  background:var(--bg-card);border-radius:var(--r);
  border:1px solid rgba(0,0,0,0.09);
  box-shadow:0 1px 0 rgba(255,255,255,0.9) inset,0 6px 20px rgba(0,0,0,0.08),0 28px 64px rgba(0,0,0,0.07);
  overflow:hidden;animation:appear .18s cubic-bezier(.34,1.15,.64,1);
}

.header{height:44px;display:flex;align-items:center;padding:0 12px;gap:8px;background:var(--bg-top);border-bottom:1px solid var(--div);-webkit-app-region:drag;flex-shrink:0;}
.header-brand{font:500 12px var(--ui);letter-spacing:.2px;color:var(--text3);flex:1;}
.header-count{font:11px var(--ui);color:var(--text3);}
.hbtn{width:28px;height:28px;background:transparent;border:none;border-radius:6px;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;outline:none;-webkit-app-region:no-drag;}
.hbtn .ico{display:flex;width:18px;height:18px;}
.hbtn .ico svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.hbtn:hover{background:rgba(0,0,0,0.06);color:var(--text);}
.hbtn.del:hover{background:rgba(220,38,38,0.10);color:var(--red);}

.body{flex:1;min-height:0;display:flex;}

.rail{
  width:148px;flex-shrink:0;background:var(--bg-rail);border-right:1px solid var(--div);
  display:flex;flex-direction:column;overflow:hidden;
}
.rail-scroll{flex:1;overflow-y:auto;padding:8px 6px 10px;}
.rail-label{
  font:600 10px var(--ui);color:var(--text3);letter-spacing:.4px;
  padding:10px 8px 4px;
}
.rail-item{
  display:flex;align-items:center;gap:6px;width:100%;
  padding:7px 8px;border:none;border-radius:8px;background:transparent;
  font:500 12px var(--ui);color:var(--text2);cursor:pointer;text-align:left;outline:none;
  transition:background .1s,color .1s;
}
.rail-item:hover{background:rgba(0,0,0,0.04);color:var(--text);}
.rail-item.active{background:var(--accent-bg);color:var(--accent);}
.rail-item.fav.active{background:var(--accent-bg);color:var(--accent);}
.rail-item.dim{opacity:.45;}
.rail-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rail-count{font:500 11px var(--ui);color:var(--text3);flex-shrink:0;}
.rail-item.active .rail-count{color:inherit;opacity:.7;}
.rail-sub{
  display:flex;align-items:center;gap:6px;width:100%;
  margin:1px 0 1px 8px;padding:5px 8px;border:none;border-radius:6px;background:transparent;
  font:500 11px var(--ui);color:var(--text3);cursor:pointer;text-align:left;outline:none;
  transition:background .1s,color .1s;
}
.rail-sub:hover{background:rgba(0,0,0,0.04);color:var(--text2);}
.rail-sub.active{background:var(--accent-bg);color:var(--accent);}
.rail-sub .rail-name{font-weight:500;}
.rail-sub .rail-count{font:500 10px var(--ui);}
.row-ver-count{font:500 10px var(--ui);color:var(--text3);background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.08);padding:2px 7px;border-radius:6px;flex-shrink:0;cursor:pointer;}
.row-ver-count:hover{color:var(--accent);border-color:var(--accent-b);background:var(--accent-bg);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}

.search-area{padding:10px 12px 8px;border-bottom:1px solid var(--div);background:var(--bg-card);flex-shrink:0;}
.search-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
input#search{
  flex:1;background:var(--bg-top);border:1px solid rgba(0,0,0,0.09);border-radius:8px;
  padding:8px 12px;font:12px var(--ui);color:var(--text);outline:none;caret-color:var(--accent);
  transition:border-color .14s,box-shadow .14s;user-select:text;-webkit-user-select:text;
}
input#search::placeholder{color:var(--text3);}
input#search:focus{border-color:rgba(85,88,232,0.35);box-shadow:0 0 0 3px rgba(85,88,232,0.07);}

.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.filter-btn{
  background:transparent;border:1px solid rgba(0,0,0,0.10);border-radius:6px;
  padding:4px 10px;font:500 11px var(--ui);color:var(--text2);cursor:pointer;
  transition:all .12s;outline:none;
}
.filter-btn.active{background:var(--accent-bg);border-color:var(--accent-b);color:var(--accent);}
.filter-btn:hover:not(.active){background:var(--bg-top);color:var(--text);}
.filter-hint{font:11px var(--ui);color:var(--text3);margin-left:2px;}

.list-wrap{flex:1;overflow-y:auto;padding:4px 0 6px;}
.card-row{
  padding:10px 12px;margin:0 6px;border-radius:8px;
  cursor:pointer;transition:background .10s;display:flex;gap:8px;align-items:flex-start;
}
.card-row:hover{background:rgba(0,0,0,0.03);}
.card-row:active{background:var(--accent-bg);}
.row-star{
  flex-shrink:0;width:24px;height:24px;margin-top:1px;border:none;background:transparent;
  color:var(--text3);cursor:pointer;border-radius:6px;
  display:flex;align-items:center;justify-content:center;outline:none;
}
.row-star .ico{width:16px;height:16px;display:flex;pointer-events:none;}
.row-star .ico svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.row-star:hover{background:rgba(245,158,11,0.12);color:var(--star);}
.card-row.is-fav .row-star{color:var(--star);}
.card-row.is-fav .row-star .ico path{fill:var(--star);}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.row-meta{display:flex;align-items:center;gap:6px;}
.row-name{font:600 13px var(--ui);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.row-ver{font:500 10px var(--ui);color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-b);padding:2px 7px;border-radius:6px;flex-shrink:0;}
.row-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.chip{
  font:500 10px var(--ui);padding:2px 7px;border-radius:6px;max-width:110px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;
}
.chip-cat{color:var(--text2);background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.08);}
.chip-tag{color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-b);}
.chip-more{color:var(--text3);background:transparent;border:1px dashed rgba(0,0,0,0.12);}
.chip-muted{color:var(--text3);background:transparent;border:1px dashed rgba(0,0,0,0.10);}
.row-foot{
  display:flex;align-items:baseline;gap:6px;min-width:0;
  font:11px var(--ui);color:var(--text3);
}
.row-time{flex-shrink:0;}
.row-copy{flex-shrink:0;}
.row-preview{
  flex:1;min-width:0;font:12px/1.4 var(--ui);color:var(--text2);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.88;
}
.row-preview.empty{font-style:italic;color:var(--text3);}

.empty-state{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
.empty-state .icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;color:var(--text2);}
.empty-state .icon svg{width:30px;height:30px;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.empty-state .msg{font:12px var(--ui);color:var(--text3);}

.footer-bar{
  border-top:1px solid var(--div);padding:8px 12px;
  background:var(--bg-top);flex-shrink:0;
  display:flex;align-items:center;gap:8px;
}
.footer-bar-text{font:11px var(--ui);color:var(--text3);flex:1;}
.btn-ghost{
  background:transparent;border:none;border-radius:6px;
  padding:6px 10px;font:500 11px var(--ui);color:var(--text2);cursor:pointer;
  transition:color .12s,background .12s;outline:none;
}
.btn-ghost:hover{background:rgba(0,0,0,0.04);color:var(--text);}
.btn-ghost:disabled{opacity:.55;cursor:wait;}
.btn-primary{
  background:var(--accent);border:1px solid var(--accent);border-radius:6px;
  padding:6px 14px;font:500 12px var(--ui);color:#fff;cursor:pointer;
  transition:background .12s,border-color .12s;outline:none;
}
.btn-primary:hover{background:#484bcc;border-color:#484bcc;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.10);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:rgba(85,88,232,0.25);}
@keyframes appear{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <span class="header-brand">Sticky-Notes</span>
    <span class="header-count" id="hCount">—</span>
    <button class="hbtn" id="btnMemory" title="使用记忆"><span class="ico" data-icon="list"></span></button>
    <button class="hbtn del" id="btnClose" title="关闭总览"><span class="ico" data-icon="close"></span></button>
  </div>

  <div class="body">
    <aside class="rail" aria-label="主题">
      <div class="rail-scroll" id="themeRail"></div>
    </aside>

    <div class="main">
      <div class="search-area">
        <div class="search-row">
          <input id="search" placeholder="搜索名称、内容或标签…" spellcheck="false">
        </div>
        <div class="filter-row">
          <button class="filter-btn active" data-sort="recent">最近</button>
          <button class="filter-btn" data-sort="most">最多复制</button>
          <span class="filter-hint" id="filterHint"></span>
        </div>
      </div>
      <div class="list-wrap" id="listWrap"></div>
      <div class="footer-bar">
        <span class="footer-bar-text">点击打开 · 星标收藏</span>
        <button class="btn-ghost" id="btnClassify" title="为未分类旧数据补全主题与标签">整理分类</button>
        <button class="btn-primary" id="btnNew">＋ 新建</button>
      </div>
    </div>
  </div>
</div>
<script src="ui-icons.js?v=codicon3"></script>
<script>
StickyIcons.mount()
let allNotes=[], currentSort='recent', searchQ=''
/** 'all' | 'fav' | '_uncat' | category string */
let themeKey='all'
/** null | project group key */
let projectKey=null

const UNCAT = '_uncat'

const THEME_LABELS = {
  nine_center: '活动中心',
  nine_skills: '技能包',
  tools: '工具',
  arch: '架构',
  coding: '编程',
  writing: '写作',
  review: '评审',
  workflows: '工作流',
  configs: '配置',
}

function themeLabel(key) {
  if (key === 'all') return '全部'
  if (key === 'fav') return '收藏'
  if (key === UNCAT) return '未分类'
  return THEME_LABELS[key] || key
}

function relTime(iso){if(!iso)return'—';const s=(Date.now()-new Date(iso))/1000;if(s<60)return`${Math.floor(s)}s前`;if(s<3600)return`${Math.floor(s/60)}m前`;if(s<86400)return`${Math.floor(s/3600)}h前`;return`${Math.floor(s/86400)}d前`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function noteCategory(n) {
  const c = (n.category || '').trim()
  return c || UNCAT
}

function coreTags(n) {
  const raw = (Array.isArray(n.okfTags) && n.okfTags.length)
    ? n.okfTags
    : (Array.isArray(n.tags) ? n.tags : [])
  return raw.map(t => String(t).trim()).filter(Boolean).slice(0, 3)
}

function noteTitle(n) {
  return (n.project || '').trim() || '未命名'
}

function groupKeyOf(n, byId) {
  const name = (n.project || '').trim().toLowerCase()
  if (name) return `p:${name}`
  let cur = n
  const seen = new Set()
  while (cur?.parentNoteId && byId.has(cur.parentNoteId) && !seen.has(cur.parentNoteId)) {
    seen.add(cur.id)
    cur = byId.get(cur.parentNoteId)
  }
  return `id:${cur.id}`
}

function buildNoteIndex(notes) {
  return { byId: new Map(notes.map(n => [n.id, n])) }
}

function groupNotes(notes) {
  const { byId } = buildNoteIndex(notes)
  const map = new Map()
  for (const n of notes) {
    const key = groupKeyOf(n, byId)
    if (!map.has(key)) map.set(key, [])
    map.get(key).push(n)
  }
  const groups = []
  for (const [key, members] of map.entries()) {
    members.sort((a, b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0))
    const latest = members[0]
    groups.push({
      key,
      label: noteTitle(latest),
      members,
      latest,
      size: members.length,
      category: noteCategory(latest),
    })
  }
  return groups
}

function projectsUnderTheme(theme, notes) {
  let pool = notes
  if (theme === 'fav') pool = notes.filter(n => n.favorite)
  else if (theme === UNCAT) pool = notes.filter(n => noteCategory(n) === UNCAT)
  else if (theme !== 'all') pool = notes.filter(n => noteCategory(n) === theme)
  return groupNotes(pool).sort((a, b) => a.label.localeCompare(b.label, 'zh-CN'))
}

function buildThemeStats(notes) {
  const map = new Map()
  let fav = 0
  for (const n of notes) {
    if (n.favorite) fav++
    const key = noteCategory(n)
    map.set(key, (map.get(key) || 0) + 1)
  }
  const cats = [...map.entries()]
    .filter(([k]) => k !== UNCAT)
    .sort((a, b) => themeLabel(a[0]).localeCompare(themeLabel(b[0]), 'zh-CN'))
  const uncat = map.get(UNCAT) || 0
  return { total: notes.length, fav, cats, uncat }
}

function renderRail() {
  const rail = document.getElementById('themeRail')
  const st = buildThemeStats(allNotes)
  const parts = []

  const pushTheme = (it) => {
    const active = themeKey === it.key && !projectKey ? ' active' : ''
    const title = it.title ? ` title="${esc(it.title)}"` : ''
    parts.push(`<button type="button" class="rail-item ${it.cls||''}${active}" data-theme="${esc(it.key)}"${title}>
      <span class="rail-name">${esc(it.label)}</span>
      <span class="rail-count">${it.count}</span>
    </button>`)
    if (themeKey === it.key && it.key !== 'fav') {
      const list = it.key === 'all'
        ? projectsUnderTheme('all', allNotes).filter(g => g.size > 1)
        : projectsUnderTheme(it.key, allNotes)
      for (const g of list) {
        const subActive = projectKey === g.key ? ' active' : ''
        parts.push(`<button type="button" class="rail-sub${subActive}" data-theme="${esc(it.key)}" data-project="${esc(g.key)}" title="${esc(g.label)}">
          <span class="rail-name">${esc(g.label)}</span>
          <span class="rail-count">${g.size}</span>
        </button>`)
      }
    }
  }

  pushTheme({ key: 'all', label: '全部', count: st.total, cls: '' })
  pushTheme({ key: 'fav', label: '★ 收藏', count: st.fav, cls: 'fav' })
  parts.push('<div class="rail-label">主题</div>')
  for (const [name, count] of st.cats) {
    pushTheme({
      key: name,
      label: themeLabel(name),
      title: name === themeLabel(name) ? '' : name,
      count,
      cls: '',
    })
  }
  if (st.uncat > 0 || themeKey === UNCAT) {
    pushTheme({
      key: UNCAT,
      label: '未分类',
      count: st.uncat,
      cls: st.uncat === 0 ? 'dim' : '',
    })
  }

  rail.innerHTML = parts.join('')
  rail.querySelectorAll('[data-theme]').forEach(btn => {
    btn.addEventListener('click', () => {
      themeKey = btn.dataset.theme
      projectKey = btn.dataset.project || null
      render()
    })
  })
}

function filterByTheme(notes) {
  let arr = notes.slice()
  if (themeKey === 'fav') arr = arr.filter(n => n.favorite)
  else if (themeKey === UNCAT) arr = arr.filter(n => noteCategory(n) === UNCAT)
  else if (themeKey !== 'all') arr = arr.filter(n => noteCategory(n) === themeKey)
  return arr
}

function getSorted(notes) {
  let arr = filterByTheme(notes)
  const { byId } = buildNoteIndex(allNotes)
  if (projectKey) arr = arr.filter(n => groupKeyOf(n, byId) === projectKey)
  if (searchQ) {
    arr = arr.filter(n =>
      n.project?.toLowerCase().includes(searchQ) ||
      n.content?.toLowerCase().includes(searchQ) ||
      n.version?.includes(searchQ) ||
      n.promptGroup?.toLowerCase().includes(searchQ) ||
      n.sourceRelPath?.toLowerCase().includes(searchQ) ||
      n.category?.toLowerCase().includes(searchQ) ||
      themeLabel(noteCategory(n)).toLowerCase().includes(searchQ) ||
      coreTags(n).some(t => t.toLowerCase().includes(searchQ))
    )
  }
  if (currentSort === 'most') return arr.sort((a, b) => (b.copyCount || 0) - (a.copyCount || 0))
  return arr.sort((a, b) => {
    if (themeKey === 'all' && !projectKey) {
      if (a.favorite && !b.favorite) return -1
      if (!a.favorite && b.favorite) return 1
    }
    return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0)
  })
}

function renderChips(n) {
  const cat = (n.category || '').trim()
  const tags = coreTags(n)
  const parts = []
  if (cat && themeKey !== cat) {
    parts.push(`<span class="chip chip-cat" title="${esc(cat)}">${esc(themeLabel(cat))}</span>`)
  }
  const maxTags = 2
  const shown = tags.slice(0, maxTags)
  for (const t of shown) parts.push(`<span class="chip chip-tag" title="标签">${esc(t)}</span>`)
  const rest = tags.length - shown.length
  if (rest > 0) parts.push(`<span class="chip chip-more" title="${esc(tags.slice(maxTags).join(', '))}">+${rest}</span>`)
  if (!parts.length && themeKey === 'all' && !projectKey) {
    parts.push('<span class="chip chip-muted">未打标</span>')
  }
  return parts.join('')
}

function renderRow(n, opts = {}) {
  const name = noteTitle(n)
  const ver = n.version || '0.1'
  const preview = n.content?.trim() || ''
  const copies = n.copyCount > 0 ? `<span class="row-copy">· ${n.copyCount}×</span>` : ''
  const group = n.promptGroup ? esc(n.promptGroup) : ''
  const titleAttr = group ? ` title="${group}"` : ''
  const verHint = (!opts.groupSize || opts.groupSize <= 1) && n.parentNoteId
    ? '<span class="row-ver" style="opacity:.7">分支</span>' : ''
  const groupBadge = opts.groupSize > 1
    ? `<button type="button" class="row-ver-count" data-open-group="${esc(opts.groupKey)}" title="查看全部 ${opts.groupSize} 个版本">${opts.groupSize} 版</button>`
    : ''
  const chips = renderChips(n)
  return `<div class="card-row${n.favorite ? ' is-fav' : ''}" data-id="${n.id}"${titleAttr}>
    <button type="button" class="row-star" data-fav="${n.id}" title="${n.favorite ? '取消收藏' : '收藏'}"><span class="ico ico-star" data-icon="star"></span></button>
    <div class="row-body">
      <div class="row-meta">
        <span class="row-name">${esc(name)}</span>
        <span class="row-ver">v${esc(ver)}</span>
        ${groupBadge}
        ${verHint}
      </div>
      ${chips ? `<div class="row-chips">${chips}</div>` : ''}
      <div class="row-foot">
        <span class="row-time">${relTime(n.updatedAt || n.createdAt)}</span>
        ${copies}
        <span class="row-preview${!preview ? ' empty' : ''}">${!preview ? '(空)' : esc(preview.replace(/\s+/g, ' ').substring(0, 72))}</span>
      </div>
    </div>
  </div>`
}

function render() {
  renderRail()
  const wrap = document.getElementById('listWrap')
  const notes = getSorted(allNotes)
  const collapse = !projectKey && !searchQ
  const groups = collapse ? groupNotes(notes) : null
  const displayCount = collapse ? groups.length : notes.length

  const filtered = notes.length !== allNotes.length || themeKey !== 'all' || !!searchQ || !!projectKey
  document.getElementById('hCount').textContent = filtered
    ? `显示 ${displayCount} · 共 ${allNotes.length}`
    : `${allNotes.length} 个`

  const hint = document.getElementById('filterHint')
  const sortLabel = currentSort === 'most' ? '最多复制' : '最近'
  const bits = []
  if (themeKey !== 'all') bits.push(themeLabel(themeKey))
  if (projectKey) {
    const g = groupNotes(filterByTheme(allNotes)).find(x => x.key === projectKey)
    bits.push(g?.label || '项目')
  }
  if (searchQ) bits.push(`「${searchQ}」`)
  hint.textContent = bits.length
    ? `筛选：${bits.join(' / ')} · ${sortLabel}`
    : (collapse ? `按项目折叠 · ${sortLabel}` : '')

  if (!notes.length) {
    const isEmpty = !allNotes.length
    const msg = isEmpty ? '还没有提示词，点右下角新建'
      : themeKey === 'fav' ? '没有收藏的提示词'
      : projectKey ? '该项目下没有匹配结果'
      : '没有找到匹配结果'
    wrap.innerHTML = `<div class="empty-state"><span class="icon" data-icon="note"></span><span class="msg">${msg}</span></div>`
    StickyIcons.mount(wrap)
    return
  }

  if (collapse) {
    const ordered = groups.slice().sort((a, b) => {
      if (currentSort === 'most') return (b.latest.copyCount || 0) - (a.latest.copyCount || 0)
      if (themeKey === 'all') {
        if (a.latest.favorite && !b.latest.favorite) return -1
        if (!a.latest.favorite && b.latest.favorite) return 1
      }
      return new Date(b.latest.updatedAt || 0) - new Date(a.latest.updatedAt || 0)
    })
    wrap.innerHTML = ordered.map(g => renderRow(g.latest, { groupSize: g.size, groupKey: g.key })).join('')
  } else {
    wrap.innerHTML = notes.map(n => renderRow(n)).join('')
  }

  StickyIcons.mount(wrap)
  wrap.querySelectorAll('.card-row').forEach(r => {
    r.addEventListener('click', () => window.api.focusNote(r.dataset.id))
  })
  wrap.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation()
      window.api.toggleFavorite(btn.dataset.fav)
    })
  })
  wrap.querySelectorAll('[data-open-group]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation()
      projectKey = btn.dataset.openGroup
      const g = groupNotes(allNotes).find(x => x.key === projectKey)
      if (g && themeKey === 'all') themeKey = g.category
      render()
    })
  })
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    currentSort = btn.dataset.sort
    render()
  })
})

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim().toLowerCase()
  render()
})
document.getElementById('btnMemory').addEventListener('click', () => window.api.openMemoryPanel())
document.getElementById('search').addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('search').value = ''
    searchQ = ''
    projectKey = null
    render()
  }
})
window.api.initList(notes => { allNotes = notes; render() })
document.getElementById('btnNew').addEventListener('click', () => window.api.newNote())
document.getElementById('btnClassify').addEventListener('click', async () => {
  const btn = document.getElementById('btnClassify')
  const prev = btn.textContent
  btn.disabled = true
  btn.textContent = '整理中…'
  try {
    const r = await window.api.notesBatchClassify({ mode: 'heuristic' })
    if (r.ok) {
      btn.textContent = `已更新 ${r.updated}`
      setTimeout(() => { btn.textContent = prev; btn.disabled = false }, 1800)
    } else {
      btn.textContent = r.error || '失败'
      setTimeout(() => { btn.textContent = prev; btn.disabled = false }, 2400)
    }
  } catch (e) {
    btn.textContent = e.message || '异常'
    setTimeout(() => { btn.textContent = prev; btn.disabled = false }, 2400)
  }
})
document.getElementById('btnClose').addEventListener('click', () => window.api.closeList())
document.addEventListener('keydown', e => { if (e.key === 'Escape') window.api.closeList() })
setInterval(render, 60000)
</script>
</body>
</html>
