<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Sticky-Notes</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg-card:  #ffffff;
  --bg-top:   #f8f7f4;
  --bg-mid:   #f5f3ef;
  --bg-deep:  #efecea;
  --div:      rgba(0,0,0,0.07);
  --text:     #1c1917;
  --text2:    #57534e;
  --text3:    #a8a29e;
  --accent:   #5558e8;
  --accent-bg:rgba(85,88,232,0.07);
  --accent-b: rgba(85,88,232,0.18);
  --star:     #f59e0b;
  --green:    #16a34a;
  --amber:    #d97706;
  --red:      #dc2626;
  --r: 16px;
  --ui:   'Segoe UI Variable','Segoe UI',system-ui,sans-serif;
  --mono: 'Cascadia Code','JetBrains Mono',Consolas,monospace;
}

html, body {
  width:100%; height:100%;
  background:transparent; overflow:hidden;
  user-select:none; -webkit-font-smoothing:antialiased;
}

/* ── 主卡片 ── */
.card {
  position:relative; width:100%; height:100%;
  display:flex; flex-direction:column;
  background:var(--bg-card);
  border-radius:var(--r);
  border:1px solid rgba(0,0,0,0.09);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 1px 3px rgba(0,0,0,0.05),
    0 6px 20px rgba(0,0,0,0.08),
    0 28px 64px rgba(0,0,0,0.07);
  overflow:hidden;
  animation:appear .18s cubic-bezier(.34,1.15,.64,1);
}

/* ── 顶栏 ── */
.topbar {
  height:34px; display:flex; align-items:center;
  padding:0 10px;
  background:var(--bg-top);
  border-bottom:1px solid var(--div);
  -webkit-app-region:drag; flex-shrink:0;
}
.topbar-logo {
  font:500 11px var(--ui); letter-spacing:.2px; color:var(--text3);
  flex:1;
}
.win-btns { display:flex; gap:3px; -webkit-app-region:no-drag; }
.wbtn {
  width:28px; height:28px; background:transparent; border:none; border-radius:6px;
  color:var(--text2); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s, color .12s; outline:none;
}
.wbtn:hover { background:rgba(0,0,0,0.07); color:var(--text); }
.wbtn.star.on { color:var(--star); }
.wbtn.star.on .ico-star path { fill:var(--star); stroke:var(--star); }
.wbtn.star:hover { color:var(--star); background:rgba(245,158,11,0.10); }
.wbtn.pin.on { color:var(--accent); background:var(--accent-bg); }
.wbtn.del:hover { background:rgba(220,38,38,0.10); color:var(--red); }
.wbtn.close:hover { background:rgba(0,0,0,0.08); color:var(--text); }

/* 统一图标 — Cursor Codicon：16–18px · stroke 1.5 */
.ico {
  display:flex; align-items:center; justify-content:center;
  width:18px; height:18px; flex-shrink:0; pointer-events:none;
}
.ico svg {
  width:18px; height:18px;
  stroke:currentColor;
  stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;
  shape-rendering:geometricPrecision;
}
.ico-sm { width:16px; height:16px; }
.ico-sm svg { width:16px; height:16px; stroke-width:1.5; }
.ico-star path { fill:none; }
.wbtn.star.on .ico-star path { fill:var(--star); stroke:var(--star); }

/* ── 编辑区头（标题+元信息，两行压紧）── */
.head-block {
  flex-shrink:0; background:var(--bg-card);
  border-bottom:1px solid var(--div);
  padding:6px 12px 7px;
  display:flex; flex-direction:column; gap:5px;
}
.head-line {
  display:flex; align-items:center; gap:6px; min-width:0;
}
.title-input {
  flex:1; min-width:0; background:transparent; border:none; outline:none;
  font:600 13px var(--ui); color:var(--text); letter-spacing:-.1px;
  cursor:text; user-select:text; -webkit-user-select:text;
  padding:0; height:24px;
}
.title-input::placeholder { color:var(--text3); font-weight:400; font-style:italic; }
.title-input.generating { color:var(--text3); font-style:italic; }

.ver-wrap { flex-shrink:0; display:flex; align-items:center; gap:2px; }
.ver-display {
  display:inline-flex; align-items:center;
  font:500 10px/1 var(--ui); letter-spacing:.2px;
  color:var(--accent); background:var(--accent-bg);
  border:1px solid var(--accent-b);
  padding:3px 7px; border-radius:5px; cursor:pointer;
  transition:background .12s;
}
.ver-display:hover { background:rgba(85,88,232,0.12); }
.ver-display.hidden { display:none; }
.ver-input {
  width:52px; background:var(--accent-bg);
  border:1px solid var(--accent-b); border-radius:5px;
  padding:3px 6px; font:500 10px/1 var(--ui); color:var(--accent);
  outline:none; display:none;
}
.ver-input.visible { display:inline-block; }
.ver-hist {
  width:22px; height:22px; border:none; background:transparent;
  border-radius:5px; color:var(--text3); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s, color .12s; outline:none; padding:0;
}
.ver-hist:hover { background:var(--accent-bg); color:var(--accent); }

.meta-field {
  display:flex; align-items:center; gap:4px; min-width:0;
}
.meta-field.theme { flex:0 0 auto; max-width:38%; }
.meta-field.tags { flex:1; }
.meta-label {
  flex-shrink:0; font:500 10px var(--ui); color:var(--text3);
  letter-spacing:.2px; user-select:none;
}
.meta-input {
  background:var(--bg-top); border:1px solid rgba(0,0,0,0.08); border-radius:5px;
  padding:3px 7px; font:11px var(--ui); color:var(--text); outline:none; min-width:0;
  flex:1; height:24px; user-select:text; -webkit-user-select:text;
  transition:border-color .2s, box-shadow .2s;
}
.meta-input.cat { width:72px; flex:0 0 72px; }
.meta-input.flash { border-color:var(--accent-b); box-shadow:0 0 0 2px rgba(85,88,232,0.12); }
.mode-seg {
  display:inline-flex; border:1px solid rgba(0,0,0,0.10); border-radius:5px;
  overflow:hidden; flex-shrink:0;
}
.mode-btn {
  background:transparent; border:none; border-radius:0; padding:3px 8px;
  font:500 11px var(--ui); color:var(--text3); cursor:pointer; outline:none; white-space:nowrap;
}
.mode-btn + .mode-btn { border-left:1px solid rgba(0,0,0,0.08); }
.mode-btn.active { background:var(--accent-bg); color:var(--accent); }
.mode-btn:hover:not(.active) { background:rgba(0,0,0,0.03); color:var(--text2); }
.tool-ghost {
  background:transparent; border:none; border-radius:5px; padding:3px 6px;
  font:500 11px var(--ui); color:var(--text2); cursor:pointer; outline:none; white-space:nowrap;
  transition:background .12s, color .12s; flex-shrink:0;
}
.tool-ghost:hover { background:var(--accent-bg); color:var(--accent); }
.tool-ghost:disabled { opacity:.55; cursor:wait; }
.tool-ghost.done { color:var(--green); }
.tool-ghost.done:hover { background:rgba(22,163,74,0.08); color:var(--green); }
.head-spacer { flex:1; min-width:2px; }

/* ── 主工作区（普通 / AI 左右分栏）── */
.workspace {
  flex:1; display:flex; flex-direction:column;
  min-height:0; overflow:hidden;
}
.editor-pane {
  flex:1; display:flex; flex-direction:column;
  min-height:0; min-width:0;
}
.card.ai-open .workspace { flex-direction:row; }
.card.ai-open .ai-toggle { display:none; }

/* ── AI 左栏（对话）── */
.ai-pane {
  display:none; flex-direction:column;
  flex:0 0 400px; width:400px; max-width:46%;
  background:var(--bg-mid); border-right:1px solid var(--div);
}
.card.ai-open .ai-pane { display:flex; }

.ai-pane-head {
  display:flex; align-items:center; gap:8px;
  padding:9px 12px; flex-shrink:0;
  background:var(--bg-top); border-bottom:1px solid var(--div);
}
.ai-pane-title { font:600 12px var(--ui); color:var(--text); flex:1; }
.ai-pane-head .ico { color:var(--text2); }
.ai-pane-close {
  background:transparent; border:1px solid rgba(0,0,0,0.10);
  border-radius:6px; padding:4px 9px;
  font:500 11px var(--ui); color:var(--text2); cursor:pointer;
}
.ai-pane-close:hover { background:var(--bg-card); color:var(--text); }

.chat-log {
  flex:1; overflow-y:auto; padding:12px;
  display:flex; flex-direction:column; gap:10px;
  min-height:0;
}
.chat-empty {
  font:12px/1.6 var(--ui); color:var(--text3); text-align:center;
  padding:28px 12px;
}
.chat-bubble {
  max-width:96%; padding:9px 11px; border-radius:8px;
  font:12px/1.65 var(--ui); word-break:break-word;
  user-select:text; -webkit-user-select:text;
}
.chat-bubble.user {
  align-self:flex-end; background:var(--accent); color:#fff;
  border-bottom-right-radius:4px;
}
.chat-bubble.assistant {
  align-self:flex-start; background:var(--bg-card);
  border:1px solid var(--div); color:var(--text);
  border-bottom-left-radius:4px;
}
.chat-bubble.loading { color:var(--text3); font-style:italic; border-style:dashed; }
.chat-bubble.streaming .stream-cursor {
  display:inline-block; margin-left:1px; color:var(--accent);
  animation:stream-blink 0.9s step-end infinite;
}
@keyframes stream-blink { 50% { opacity:0; } }
.chat-bubble.err { border-color:rgba(220,38,38,0.25); background:rgba(220,38,38,0.05); color:var(--red); }
.chat-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.chat-act {
  font:500 11px var(--ui); color:var(--accent);
  background:var(--accent-bg); border:1px solid var(--accent-b);
  border-radius:6px; padding:3px 8px; cursor:pointer;
}
.chat-act:hover { background:rgba(85,88,232,0.14); }
.chat-act.subtle { color:var(--text2); background:transparent; border-color:rgba(0,0,0,0.10); }

.ai-pane-foot {
  flex-shrink:0; padding:10px 12px 12px;
  border-top:1px solid var(--div); background:var(--bg-top);
  display:flex; flex-direction:column; gap:8px;
}

/* ── 编辑区 ── */
.editor-wrap { flex:1; position:relative; overflow:hidden; }
textarea#editor {
  position:absolute; inset:0;
  width:100%; height:100%;
  padding:13px 14px 10px;
  background:transparent; border:none; outline:none; resize:none;
  font:13px/1.9 var(--mono);
  color:var(--text); caret-color:var(--accent);
  user-select:text; -webkit-user-select:text;
  overflow-y:auto; letter-spacing:.01em;
}
textarea#editor::placeholder {
  font:13px/1.7 var(--ui); font-style:italic; color:var(--text3);
}

/* ── 变量提示栏 ── */
.var-bar {
  display:none;
  padding:5px 13px;
  background:rgba(85,88,232,0.05);
  border-top:1px solid rgba(85,88,232,0.10);
  flex-shrink:0;
}
.var-bar.visible { display:flex; align-items:center; gap:5px; }
.var-bar-label { font:11px var(--ui); color:var(--text3); flex-shrink:0; }
.var-chips { display:flex; flex-wrap:wrap; gap:4px; flex:1; min-width:0; }
.var-chip {
  font:500 10px var(--ui); color:var(--text2);
  background:rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.08);
  padding:2px 7px; border-radius:6px; white-space:nowrap;
}

/* ── 底栏 ── */
.footer {
  display:flex; align-items:center;
  padding:9px 14px; gap:8px;
  background:var(--bg-top);
  border-top:1px solid var(--div);
  flex-shrink:0;
}
.footer-meta { flex:1; display:flex; align-items:center; gap:6px; min-width:0; }
.save-dot {
  width:5px; height:5px; border-radius:50%;
  background:var(--text3); flex-shrink:0; transition:background .3s;
}
.save-time { font:11px var(--ui); color:var(--text3); transition:color .3s; white-space:nowrap; }
.footer-sep { color:var(--text3); font:11px var(--ui); flex-shrink:0; }
.footer-cnt { font:11px var(--ui); color:var(--text2); flex-shrink:0; }
.copy-count { font:11px var(--ui); color:var(--text3); flex-shrink:0; margin-left:2px; }

.footer-meta.dirty .save-dot  { background:var(--amber); }
.footer-meta.dirty .save-time { color:var(--amber); }
.footer-meta.saved .save-dot  { background:var(--green); }
.footer-meta.saved .save-time { color:var(--green); }

/* 复制 — Cursor 工具栏：描边按钮，非实心色块 */
.btn-copy-primary {
  display:flex; align-items:center; gap:5px; flex-shrink:0;
  background:transparent;
  border:1px solid rgba(0,0,0,0.14);
  border-radius:6px; padding:5px 11px;
  font:500 12px var(--ui); color:var(--text2); cursor:pointer;
  transition:background .12s, border-color .12s, color .12s; outline:none;
}
.btn-copy-primary:hover  { background:rgba(0,0,0,0.04); border-color:rgba(0,0,0,0.20); color:var(--text); }
.btn-copy-primary:active { transform:scale(.97); }
.btn-copy-primary.copied { color:var(--green); border-color:rgba(22,163,74,0.35); background:rgba(22,163,74,0.06); }

.btn-copy-primary .ico { color:currentColor; }
.btn-copy-primary.copied .ico { color:var(--green); }

/* ── AI 折叠条（未展开时）── */
.ai-toggle {
  display:flex; align-items:center; gap:8px;
  padding:9px 14px; border-top:1px solid var(--div);
  background:var(--bg-mid); cursor:pointer;
  transition:background .12s; flex-shrink:0; user-select:none;
}
.ai-toggle:hover { background:var(--bg-deep); }
.ai-toggle-label { font:500 12px var(--ui); color:var(--text); flex:1; }
.ai-toggle .ico { color:var(--text2); }
.ai-toggle-hint  { font:11px var(--ui); color:var(--text3); }
.ai-toggle-arrow { color:var(--text3); }
.ai-toggle-arrow .ico svg { width:14px; height:14px; stroke-width:1.5; }

.quick-row { display:flex; gap:5px; flex-wrap:wrap; }
.quick-chip {
  display:inline-flex; align-items:center; gap:5px;
  background:var(--bg-card); border:1px solid rgba(0,0,0,0.10);
  border-radius:6px; padding:5px 10px;
  font:500 11px var(--ui); color:var(--text2); cursor:pointer;
  transition:background .12s, border-color .12s, color .12s; outline:none;
}
.quick-chip .ico { color:var(--text2); transition:color .12s; }
.quick-chip:hover { background:rgba(0,0,0,0.03); border-color:rgba(0,0,0,0.16); color:var(--text); }
.quick-chip:hover .ico { color:var(--text); }
.quick-chip:active { transform:scale(.97); }

.ai-input-row { display:flex; align-items:flex-end; gap:6px; }
textarea#aiInput {
  flex:1; background:var(--bg-card); border:1px solid rgba(0,0,0,0.10);
  border-radius:8px; padding:7px 11px; min-height:36px; max-height:88px;
  font:12px/1.5 var(--ui); color:var(--text); outline:none; caret-color:var(--accent);
  resize:none; transition:border-color .14s, box-shadow .14s;
  user-select:text; -webkit-user-select:text;
}
textarea#aiInput::placeholder { color:var(--text3); }
textarea#aiInput:focus { border-color:rgba(85,88,232,0.38); box-shadow:0 0 0 3px rgba(85,88,232,0.07); }

.ai-go {
  width:32px; height:32px;
  background:transparent; border:1px solid rgba(0,0,0,0.14);
  border-radius:6px; color:var(--text2); cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s, border-color .12s, color .12s; outline:none;
}
.ai-go:hover  { background:rgba(0,0,0,0.04); border-color:rgba(0,0,0,0.22); color:var(--text); }
.ai-go:active { transform:scale(.92); }
.ai-go:disabled { opacity:.4; cursor:default; }
.ai-go .ico { width:16px; height:16px; }
.ai-go .ico svg { width:16px; height:16px; stroke-width:1.5; }

/* 滚动条 */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.10); border-radius:2px; }
::-webkit-scrollbar-thumb:hover { background:rgba(85,88,232,0.25); }

@keyframes appear {
  from { opacity:0; transform:scale(.96) translateY(8px); }
  to   { opacity:1; transform:scale(1)   translateY(0); }
}

.sections-wrap { display:none; flex:1; flex-direction:column; min-height:0; overflow-y:auto; padding:8px 14px; gap:8px; }.sections-wrap.visible { display:flex; }
.section-field label { display:block; font:600 10px var(--ui); color:var(--text3); letter-spacing:.3px; margin-bottom:4px; }
.section-field textarea { width:100%; min-height:48px; max-height:100px; background:var(--bg-top); border:1px solid rgba(0,0,0,0.08); border-radius:8px; padding:8px 10px; font:12px/1.5 var(--mono); color:var(--text); outline:none; resize:vertical; user-select:text; -webkit-user-select:text; }
.editor-wrap.hidden-mode { display:none; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:200; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal { width:min(92%,500px); max-height:78%; background:var(--bg-card); border-radius:12px; border:1px solid var(--div); box-shadow:0 20px 60px rgba(0,0,0,0.2); display:flex; flex-direction:column; overflow:hidden; }
.modal-head { padding:12px 14px; font:600 13px var(--ui); border-bottom:1px solid var(--div); display:flex; justify-content:space-between; align-items:center; }
.modal-body { flex:1; overflow:auto; padding:12px 14px; font:11px/1.55 var(--mono); }
.modal-close {
  width:28px; height:28px; background:transparent; border:none; border-radius:6px;
  color:var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center;
  outline:none;
}
.modal-close:hover { background:rgba(0,0,0,0.06); color:var(--text); }
.diff-add { background:rgba(22,163,74,0.10); color:var(--green); padding:1px 4px; }
.diff-del { background:rgba(220,38,38,0.08); color:var(--red); padding:1px 4px; }
.diff-same { color:var(--text2); padding:1px 4px; }
.token-est { font:11px var(--ui); color:var(--text3); }
.ver-list { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
.ver-item { padding:6px 8px; border-radius:6px; cursor:pointer; font:11px var(--ui); border:1px solid transparent; }
.ver-item:hover { background:var(--accent-bg); border-color:var(--accent-b); }
.ver-item.current { background:var(--accent-bg); color:var(--accent); }

.toast-wrap {
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(8px);
  opacity:0; pointer-events:none; z-index:300; transition:opacity .18s, transform .18s;
}
.toast-wrap.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast {
  background:#1c1917; color:#fff; font:500 12px var(--ui);
  padding:8px 14px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.18);
  max-width:min(90vw, 320px); text-align:center;
}
.toast-wrap.error .toast { background:#7f1d1d; }
.toast-wrap.success .toast { background:#14532d; }
</style>
</head>
<body>
<div class="card" id="card">

  <!-- 顶栏 -->
  <div class="topbar">
    <span class="topbar-logo">Sticky-Notes</span>
    <div class="win-btns">
      <button class="wbtn star" id="btnStar" title="收藏">
        <span class="ico ico-star" id="icoStar" data-icon="star"></span>
      </button>
      <button class="wbtn pin" id="btnPin" title="窗口置顶">
        <span class="ico" data-icon="pin"></span>
      </button>
      <button class="wbtn del" id="btnDel" title="删除便签（不可恢复）">
        <span class="ico" data-icon="trash"></span>
      </button>
      <button class="wbtn close" id="btnHide" title="关闭窗口（仅隐藏，不删除） Esc">
        <span class="ico" data-icon="close"></span>
      </button>
    </div>
  </div>

  <div class="workspace" id="workspace">

    <!-- AI 左栏：对话 -->
    <aside class="ai-pane" id="aiPane">
      <div class="ai-pane-head">
        <span class="ico" data-icon="chat"></span>
        <span class="ai-pane-title">AI 助写</span>
        <button class="ai-pane-close" id="aiClose" type="button">收起</button>
      </div>
      <div class="chat-log" id="chatLog">
        <div class="chat-empty">描述需求或点快捷指令，AI 会在这里对话<br>生成结果可应用到右侧编辑区</div>
      </div>
      <div class="ai-pane-foot">
        <div class="quick-row">
          <button class="quick-chip" data-p="优化这段提示词，让它更清晰准确、减少歧义，直接输出优化后的提示词">
            <span class="ico ico-sm" data-icon="optimize"></span>优化
          </button>
          <button class="quick-chip" data-p="在保留原意的前提下扩展这段提示词，补充更多细节和约束条件">
            <span class="ico ico-sm" data-icon="expandText"></span>扩展
          </button>
          <button class="quick-chip" data-p="精简这段提示词，去掉冗余，只保留核心意图，直接输出精简后的提示词">
            <span class="ico ico-sm" data-icon="simplify"></span>精简
          </button>
          <button class="quick-chip" data-p="将下面这段提示词翻译成英文，保持原意">
            <span class="ico ico-sm" data-icon="en"></span>EN
          </button>
        </div>
        <div class="ai-input-row">
          <textarea id="aiInput" rows="1" placeholder="描述你的需求… Enter 发送，Shift+Enter 换行" spellcheck="false"></textarea>
          <button class="ai-go" id="aiSend" title="发送" type="button">
            <span class="ico ico-sm" data-icon="send"></span>
          </button>
        </div>
      </div>
    </aside>

    <!-- 右栏：编辑区 -->
    <section class="editor-pane">
      <div class="head-block">
        <div class="head-line">
          <input class="title-input" id="inpProject"
                 placeholder="提示词名称…" maxlength="40" spellcheck="false" title="名称，显示在总览列表">
          <div class="ver-wrap">
            <span class="ver-display" id="verDisplay" title="点击修改版本号">v0.1</span>
            <input class="ver-input"  id="verInput" maxlength="12" spellcheck="false">
            <button class="ver-hist" id="btnVersions" type="button" title="查看历史版本与差异">
              <span class="ico ico-sm" data-icon="history"></span>
            </button>
          </div>
          <div class="mode-seg" role="group" aria-label="编辑方式">
            <button class="mode-btn active" id="modeFree" type="button" title="一整段自由编写">全文</button>
            <button class="mode-btn" id="modeStruct" type="button" title="按角色/任务等分段填写">分段</button>
          </div>
        </div>
        <div class="head-line">
          <label class="meta-field theme">
            <span class="meta-label">主题</span>
            <input class="meta-input cat" id="inpCategory" placeholder="工具" maxlength="32" spellcheck="false" title="总览左侧按主题筛选，可填中文或英文 key">
          </label>
          <label class="meta-field tags">
            <span class="meta-label">标签</span>
            <input class="meta-input" id="inpOkfTags" placeholder="逗号分隔，便于检索" spellcheck="false" title="知识库标签，勿与名称重复">
          </label>
          <span class="head-spacer" aria-hidden="true"></span>
          <button class="tool-ghost" id="btnPromote" type="button" title="保存到本机知识库，便于复用">收入库</button>
          <button class="tool-ghost" id="btnSuggest" type="button" title="用 AI 建议主题与标签">智能分类</button>
        </div>
      </div>
      <div class="sections-wrap" id="sectionsWrap">
        <div class="section-field"><label>角色</label><textarea id="secRole" spellcheck="false" placeholder="你是什么样的专家…"></textarea></div>
        <div class="section-field"><label>背景</label><textarea id="secContext" spellcheck="false" placeholder="场景与已知信息…"></textarea></div>
        <div class="section-field"><label>任务</label><textarea id="secTask" spellcheck="false" placeholder="要完成什么…"></textarea></div>
        <div class="section-field"><label>输出格式</label><textarea id="secOutput" spellcheck="false" placeholder="期望的结构与格式…"></textarea></div>
        <div class="section-field"><label>成功标准</label><textarea id="secCriteria" spellcheck="false" placeholder="怎样算写好了…"></textarea></div>
      </div>
      <div class="editor-wrap" id="editorWrap">
        <textarea id="editor"
          placeholder="在此编写提示词…&#10;&#10;可用 {{变量名}} 作为占位符&#10;点底部「AI 助写」可边聊边改"></textarea>
      </div>
      <div class="var-bar" id="varBar">
        <span class="var-bar-label">变量</span>
        <div class="var-chips" id="varChips"></div>
      </div>
      <div class="footer">
        <div class="footer-meta" id="footerMeta">
          <span class="save-dot"></span>
          <span class="save-time" id="saveTime">—</span>
          <span class="footer-sep">·</span>
          <span class="footer-cnt" id="cnt">0</span>
          <span class="token-est" id="tokenEst"></span>
          <span class="copy-count" id="copyCountEl"></span>
        </div>
        <button class="btn-copy-primary" id="btnCopy" title="复制提示词到剪贴板">
          <span class="ico ico-sm" id="copyIcon" data-icon="copy"></span>
          <span id="copyText">复制</span>
        </button>
      </div>
    </section>

  </div>

  <!-- 底部 AI 入口（未展开时） -->
  <div class="ai-toggle" id="aiToggle" title="打开左侧 AI 对话，边聊边改提示词">
    <span class="ico" data-icon="chat"></span>
    <span class="ai-toggle-label">AI 助写</span>
    <span class="ai-toggle-hint">打开侧栏对话</span>
    <span class="ai-toggle-arrow"><span class="ico" data-icon="chevronRight"></span></span>
  </div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <span id="modalTitle">版本历史</span>
      <button class="modal-close" id="modalClose" type="button" title="关闭">
        <span class="ico" data-icon="close"></span>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"><div class="toast" id="toast"></div></div>

<script src="ui-icons.js?v=codicon3"></script>
<script>
StickyIcons.mount()
let note=null, saveTimer=null, aiOpen=false, chatHistory=[]
let titleManual=false, titleTimer=null, titleReq=0
let editorMode='free'

const THEME_LABELS = {
  nine_center: '活动中心',
  nine_skills: '技能包',
  tools: '工具',
  arch: '架构',
  coding: '编程',
  writing: '写作',
  review: '评审',
  workflows: '工作流',
  configs: '配置',
}

const card      = document.getElementById('card')
const editor    = document.getElementById('editor')
const editorWrap= document.getElementById('editorWrap')
const sectionsWrap = document.getElementById('sectionsWrap')
const inpProj   = document.getElementById('inpProject')
const inpCategory = document.getElementById('inpCategory')
const inpOkfTags  = document.getElementById('inpOkfTags')
const secRole   = document.getElementById('secRole')
const secContext= document.getElementById('secContext')
const secTask   = document.getElementById('secTask')
const secOutput = document.getElementById('secOutput')
const secCriteria=document.getElementById('secCriteria')
const modeFree  = document.getElementById('modeFree')
const modeStruct= document.getElementById('modeStruct')
const btnVersions=document.getElementById('btnVersions')
const btnPromote = document.getElementById('btnPromote')
const btnSuggest = document.getElementById('btnSuggest')
const modalOverlay=document.getElementById('modalOverlay')
const modalBody = document.getElementById('modalBody')
const modalTitle= document.getElementById('modalTitle')
const modalClose= document.getElementById('modalClose')
const toastWrap = document.getElementById('toastWrap')
const toastEl   = document.getElementById('toast')
const tokenEst  = document.getElementById('tokenEst')
const verDisp   = document.getElementById('verDisplay')
const verInput  = document.getElementById('verInput')
const btnPin    = document.getElementById('btnPin')
const btnStar   = document.getElementById('btnStar')
const cntEl     = document.getElementById('cnt')
const ccEl      = document.getElementById('copyCountEl')
const footerM   = document.getElementById('footerMeta')
const saveTime  = document.getElementById('saveTime')
const btnCopy   = document.getElementById('btnCopy')
const copyIcon  = document.getElementById('copyIcon')
const copyText  = document.getElementById('copyText')
const varBar    = document.getElementById('varBar')
const varChips  = document.getElementById('varChips')
const aiToggle  = document.getElementById('aiToggle')
const aiClose   = document.getElementById('aiClose')
const chatLog   = document.getElementById('chatLog')
const aiInput   = document.getElementById('aiInput')
const aiSend    = document.getElementById('aiSend')

function toast(msg, type = 'info', ms = 3200) {
  toastEl.textContent = msg
  toastWrap.className = 'toast-wrap show' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '')
  clearTimeout(toast._t)
  toast._t = setTimeout(() => { toastWrap.className = 'toast-wrap' }, ms)
}

function syncCategoryHint() {
  const c = inpCategory.value.trim()
  const label = THEME_LABELS[c]
  inpCategory.title = label
    ? `分类：${label}（${c}）`
    : '业务分类，便于总览筛选'
}

function flashMeta(el) {
  if (!el) return
  el.classList.remove('flash')
  void el.offsetWidth
  el.classList.add('flash')
  setTimeout(() => el.classList.remove('flash'), 900)
}

function estimateTokens(text) {
  const len = (text || '').length
  if (!len) return 0
  return Math.max(1, Math.ceil(len / 3))
}

function getSectionsFromUI() {
  return {
    role: secRole.value,
    context: secContext.value,
    task: secTask.value,
    output: secOutput.value,
    criteria: secCriteria.value,
  }
}

function assembleSectionsContent(sections) {
  const labels = { role:'角色', context:'背景', task:'任务', output:'输出格式', criteria:'成功标准' }
  const parts = []
  for (const [k, label] of Object.entries(labels)) {
    const v = (sections[k] || '').trim()
    if (v) parts.push(`## ${label}\n${v}`)
  }
  return parts.join('\n\n')
}

function parseSectionsToUI(content) {
  const labels = { '角色':'role', '背景':'context', '任务':'task', '输出格式':'output', '成功标准':'criteria' }
  const fields = { role:'', context:'', task:'', output:'', criteria:'' }
  const text = (content || '').trim()
  if (!text) return fields
  for (const block of text.split(/^##\s*/m).filter(Boolean)) {
    const nl = block.indexOf('\n')
    const title = (nl >= 0 ? block.slice(0, nl) : block).trim()
    const body = nl >= 0 ? block.slice(nl + 1).trim() : ''
    const key = labels[title]
    if (key) fields[key] = body
  }
  return fields
}

function setSectionsUI(sections) {
  secRole.value = sections?.role || ''
  secContext.value = sections?.context || ''
  secTask.value = sections?.task || ''
  secOutput.value = sections?.output || ''
  secCriteria.value = sections?.criteria || ''
}

function getActiveContent() {
  if (editorMode === 'structured') return assembleSectionsContent(getSectionsFromUI())
  return editor.value
}

function updateCounts() {
  const text = getActiveContent()
  cntEl.textContent = text.length
  tokenEst.textContent = text.length ? `~${estimateTokens(text)} tok` : ''
}

function setEditorMode(mode) {
  editorMode = mode
  const structured = mode === 'structured'
  modeFree.classList.toggle('active', !structured)
  modeStruct.classList.toggle('active', structured)
  sectionsWrap.classList.toggle('visible', structured)
  editorWrap.classList.toggle('hidden-mode', structured)
  if (structured) {
    const secs = note?.sections || parseSectionsToUI(editor.value)
    setSectionsUI(secs)
    if (note) note.sections = secs
  } else if (note?.sections) {
    editor.value = assembleSectionsContent(note.sections) || editor.value
  }
  updateCounts()
  updateVarBar(getActiveContent())
  if (note) { note.editorMode = mode; schedSave() }
}

// ── 工具 ──────────────────────────────────────────────────────────────────────
function relTime(iso) {
  if (!iso) return '—'
  const s = (Date.now()-new Date(iso))/1000
  if (s<5)    return '刚刚'
  if (s<60)   return `${Math.floor(s)}s 前`
  if (s<3600) return `${Math.floor(s/60)}m 前`
  if (s<86400)return `${Math.floor(s/3600)}h 前`
  return `${Math.floor(s/86400)}d 前`
}

// ── 变量检测 {{...}} ─────────────────────────────────────────────────────────
function detectVars(text) {
  const matches = [...text.matchAll(/\{\{([^}]+)\}\}/g)]
  return [...new Set(matches.map(m => m[1].trim()))].filter(Boolean)
}
function updateVarBar(text) {
  const vars = detectVars(text)
  if (vars.length === 0) { varBar.classList.remove('visible'); return }
  varBar.classList.add('visible')
  varChips.innerHTML = vars.map(v => `<span class="var-chip">{{${v}}}</span>`).join('')
}

// ── 存档状态 ──────────────────────────────────────────────────────────────────
function markDirty() { footerM.className='footer-meta dirty'; saveTime.textContent='编辑中…' }
function markSaved() {
  footerM.className='footer-meta saved'; saveTime.textContent='已保存'
  setTimeout(()=>{ footerM.className='footer-meta'; saveTime.textContent=relTime(note?.updatedAt) }, 1800)
}
function schedSave() {
  markDirty(); clearTimeout(saveTimer)
  saveTimer = setTimeout(()=>{
    if (!note) return
    const sections = editorMode === 'structured' ? getSectionsFromUI() : null
    const content = editorMode === 'structured'
      ? assembleSectionsContent(sections)
      : editor.value
    const okfTags = inpOkfTags.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean)
    window.api.updateNote({
      id: note.id,
      content,
      project: inpProj.value.trim(),
      projectManual: titleManual,
      version: note.version || '0.1',
      category: inpCategory.value.trim(),
      okfTags,
      sections,
      editorMode,
    })
    note.content = content
    note.category = inpCategory.value.trim()
    note.okfTags = okfTags
    note.sections = sections
    note.editorMode = editorMode
    markSaved()
  }, 700)
}

// ── 标题自动提炼 ──────────────────────────────────────────────────────────────
function getFirstParagraph(text) {
  const trimmed = (text || '').trim()
  if (!trimmed) return ''
  const blank = trimmed.search(/\n\s*\n/)
  return (blank >= 0 ? trimmed.slice(0, blank) : trimmed).trim()
}

function shouldAutoTitle() {
  return !titleManual && !inpProj.value.trim()
}

function applyAutoTitle(title) {
  const t = (title || '').trim().slice(0, 40)
  if (!t || !shouldAutoTitle()) return
  inpProj.value = t
  if (note) note.project = t
  schedSave()
}

function scheduleAutoTitle(delay = 1500) {
  if (!shouldAutoTitle()) return
  clearTimeout(titleTimer)
  titleTimer = setTimeout(maybeAutoTitle, delay)
}

async function maybeAutoTitle() {
  if (!note || !shouldAutoTitle()) return
  const para = getFirstParagraph(editor.value)
  if (para.length < 10) return

  const req = ++titleReq
  inpProj.classList.add('generating')
  const prevPh = inpProj.placeholder
  inpProj.placeholder = '提炼标题中…'

  try {
    const result = await window.api.aiSuggestTitle({ content: editor.value })
    if (req !== titleReq || !shouldAutoTitle()) return
    if (result.title) applyAutoTitle(result.title)
  } finally {
    if (req === titleReq) {
      inpProj.classList.remove('generating')
      inpProj.placeholder = prevPh
    }
  }
}

// ── 版本 ──────────────────────────────────────────────────────────────────────
function setVersion(v) { if(note)note.version=v; verDisp.textContent=`v${v}` }
verDisp.addEventListener('click', ()=>{
  verInput.value = note?.version||'0.1'
  verDisp.classList.add('hidden'); verInput.classList.add('visible')
  verInput.focus(); verInput.select()
})
function commitVer() {
  const v = verInput.value.trim()||'0.1'; setVersion(v)
  verDisp.classList.remove('hidden'); verInput.classList.remove('visible'); schedSave()
}
verInput.addEventListener('blur', commitVer)
verInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){e.preventDefault();commitVer()}
  if(e.key==='Escape'){verDisp.classList.remove('hidden');verInput.classList.remove('visible')}
})

// ── 编辑器 ────────────────────────────────────────────────────────────────────
editor.addEventListener('input', ()=>{
  updateCounts()
  updateVarBar(editor.value)
  if(note){ note.content=editor.value; schedSave() }
  scheduleAutoTitle()
})
;[secRole, secContext, secTask, secOutput, secCriteria].forEach(el => {
  el.addEventListener('input', () => {
    if (note) note.sections = getSectionsFromUI()
    updateCounts()
    updateVarBar(getActiveContent())
    schedSave()
  })
})
inpCategory.addEventListener('input', () => { if (note) schedSave(); syncCategoryHint() })
inpOkfTags.addEventListener('input', () => { if (note) schedSave() })
modeFree.addEventListener('click', () => setEditorMode('free'))
modeStruct.addEventListener('click', () => setEditorMode('structured'))

btnPromote.addEventListener('click', async () => {
  if (!note) return
  btnPromote.disabled = true
  try {
    const r = await window.api.promoteToOkf(note.id)
    if (r.ok) {
      toast(`已收录：${r.conceptId}`, 'success')
      btnPromote.textContent = '已收录'
      btnPromote.classList.add('done')
    } else {
      toast(r.error || '收录失败', 'error')
    }
  } catch (e) {
    toast(e.message || '收录异常', 'error')
  } finally {
    btnPromote.disabled = false
  }
})

btnSuggest.addEventListener('click', async () => {
  if (!note) return
  const prev = btnSuggest.textContent
  btnSuggest.disabled = true
  btnSuggest.textContent = '分类中…'
  try {
    const r = await window.api.suggestClassification({
      content: getActiveContent(),
      project: inpProj.value.trim(),
    })
    if (!r.ok) {
      if (!r.local) toast(r.error || '建议失败', 'error')
      else toast(r.error || '无法分类', 'error')
      return
    }
    if (r.category) {
      inpCategory.value = r.category
      flashMeta(inpCategory)
      syncCategoryHint()
    }
    if (r.okfTags?.length) {
      inpOkfTags.value = r.okfTags.join(', ')
      flashMeta(inpOkfTags)
    }
    schedSave()
    const label = THEME_LABELS[r.category] || r.category || ''
    toast(label ? `已建议：${label}` : '已更新分类与标签', 'success')
  } catch (e) {
    toast(e.message || '分类异常', 'error')
  } finally {
    btnSuggest.disabled = false
    btnSuggest.textContent = prev
  }
})

btnVersions.addEventListener('click', async () => {
  if (!note) return
  const versions = await window.api.getNoteVersions(note.id)
  modalTitle.textContent = '版本历史'
  if (!versions.length) {
    modalBody.innerHTML = '<p style="font:12px var(--ui);color:var(--text3)">暂无版本记录</p>'
  } else {
    const items = versions.map(v =>
      `<div class="ver-item${v.id===note.id?' current':''}" data-id="${v.id}">v${v.version} · ${v.project||'未命名'} · ${relTime(v.updatedAt)}</div>`
    ).join('')
    modalBody.innerHTML = `<div class="ver-list">${items}</div><div id="diffArea"></div>`
    const ids = versions.map(v => v.id)
    modalBody.querySelectorAll('.ver-item').forEach(el => {
      el.addEventListener('click', async () => {
        modalBody.querySelectorAll('.ver-item').forEach(x => x.classList.remove('current'))
        el.classList.add('current')
        const other = ids.find(id => id !== el.dataset.id) || el.dataset.id
        const d = await window.api.getNoteDiff(el.dataset.id, other)
        const area = document.getElementById('diffArea')
        if (d.ok) area.innerHTML = `<p style="font:10px var(--ui);color:var(--text3);margin:8px 0">对比 v${versions.find(x=>x.id===other)?.version||'?'} → 当前选中</p>${d.html}`
        else area.textContent = d.error || '无法对比'
      })
    })
  }
  modalOverlay.classList.add('open')
})

modalClose.addEventListener('click', () => modalOverlay.classList.remove('open'))
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) modalOverlay.classList.remove('open') })
inpProj.addEventListener('input', ()=>{
  const v = inpProj.value.trim()
  titleManual = v.length > 0
  if (note) { note.project = v; note.projectManual = titleManual; schedSave() }
})
editor.addEventListener('keydown', e=>{
  if(e.key==='Tab'){ e.preventDefault(); const s=editor.selectionStart; editor.value=editor.value.slice(0,s)+'  '+editor.value.slice(editor.selectionEnd); editor.selectionStart=editor.selectionEnd=s+2; schedSave() }
  if(e.key==='Escape'){
    if (modalOverlay.classList.contains('open')) { modalOverlay.classList.remove('open'); return }
    if (aiOpen) { setAiOpen(false); return }
    window.api.hideNote(note?.id)
  }
  if(e.ctrlKey&&e.key==='s'){ e.preventDefault(); clearTimeout(saveTimer); if(note){schedSave(); markSaved()} }
  if(e.ctrlKey&&e.shiftKey&&e.key==='C'){ e.preventDefault(); copyContent() }
})

// ── 复制 ──────────────────────────────────────────────────────────────────────
function copyContent() {
  const text = editor.value.trim(); if (!text) return
  const doCopy = () => {
    btnCopy.classList.add('copied')
    copyIcon.innerHTML = StickyIcons.svg('check')
    copyText.textContent = '已复制'
    if(note){ window.api.incrementCopy(note.id); note.copyCount=(note.copyCount||0)+1; updateCopyCount() }
    setTimeout(()=>{ btnCopy.classList.remove('copied'); copyIcon.innerHTML = StickyIcons.svg('copy'); copyText.textContent='复制' }, 1600)
  }
  navigator.clipboard.writeText(text).then(doCopy).catch(()=>{ window.api.copyToClipboard(text); doCopy() })
}
function updateCopyCount() {
  const c = note?.copyCount || 0
  ccEl.textContent = c > 0 ? `· 已复制 ${c}×` : ''
}

btnCopy.addEventListener('click', copyContent)

// ── 收藏 ──────────────────────────────────────────────────────────────────────
function setFavorite(v) {
  if(note) note.favorite = v
  btnStar.classList.toggle('on', v)
}
btnStar.addEventListener('click', ()=>{ if(note) window.api.toggleFavorite(note.id) })
window.api.favoriteChanged(v => setFavorite(v))

// ── 右键 + 远程命令 ──────────────────────────────────────────────────────────
document.getElementById('card').addEventListener('contextmenu', e=>{ e.preventDefault(); if(note)window.api.showContextMenu(note.id) })
window.api.onCopy(copyContent)
window.api.onDelete(()=>note&&window.api.deleteNote(note.id))

// ── 窗口控制 ─────────────────────────────────────────────────────────────────
btnPin.addEventListener('click',  ()=>note&&window.api.togglePin(note.id))
document.getElementById('btnHide').addEventListener('click', ()=>note&&window.api.hideNote(note.id))
document.getElementById('btnDel') .addEventListener('click', ()=>note&&window.api.deleteNote(note.id))
window.api.pinChanged(p=>{ if(note)note.pinned=p; btnPin.classList.toggle('on',!!p) })

function syncLayoutState(state) {
  if (!state) return
  if (state.aiOpen !== undefined && state.aiOpen !== aiOpen) {
    aiOpen = state.aiOpen
    card.classList.toggle('ai-open', aiOpen)
  }
}

window.api.onLayoutChanged(syncLayoutState)

// ── AI 左右分栏 ─────────────────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

function renderChat() {
  if (!chatHistory.length) {
    chatLog.innerHTML = '<div class="chat-empty">描述需求或点快捷指令，AI 会在这里对话<br>生成结果可应用到右侧编辑区</div>'
    return
  }
  chatLog.innerHTML = chatHistory.map((m, i) => {
    if (m.role === 'loading') return `<div class="chat-bubble assistant loading">${escHtml(m.text)}</div>`
    if (m.role === 'error') return `<div class="chat-bubble assistant err">${escHtml(m.text)}</div>`
    if (m.role === 'user') return `<div class="chat-bubble user">${escHtml(m.text)}</div>`
    const streamCls = m.streaming ? ' streaming' : ''
    const cursor = m.streaming ? '<span class="stream-cursor">▍</span>' : ''
    const actions = (!m.streaming && m.text) ? `<div class="chat-actions">
      <button class="chat-act" data-act="replace" data-idx="${i}">替换正文</button>
      <button class="chat-act subtle" data-act="append" data-idx="${i}">追加到文末</button>
    </div>` : ''
    return `<div class="chat-bubble assistant${streamCls}" data-idx="${i}"><span class="chat-text">${escHtml(m.text)}</span>${cursor}${actions}</div>`
  }).join('')
  chatLog.scrollTop = chatLog.scrollHeight
}

function updateStreamText(idx) {
  const bubble = chatLog.querySelector(`[data-idx="${idx}"]`)
  const m = chatHistory[idx]
  if (!bubble || !m) { renderChat(); return }
  const textEl = bubble.querySelector('.chat-text')
  if (textEl) textEl.textContent = m.text
  chatLog.scrollTop = chatLog.scrollHeight
}

const TYPEWRITER_MS = 12

async function revealTypewriter(idx, fullText) {
  chatHistory[idx].streaming = true
  chatHistory[idx].text = ''
  renderChat()
  for (const ch of Array.from(fullText)) {
    chatHistory[idx].text += ch
    updateStreamText(idx)
    await new Promise(r => setTimeout(r, TYPEWRITER_MS))
  }
}

function applyAssistantText(text, mode) {
  if (!text) return
  if (mode === 'replace') {
    editor.value = text
  } else {
    const sep = editor.value.trim() ? '\n\n---\n' : ''
    editor.value += sep + text
  }
  cntEl.textContent = editor.value.length
  updateVarBar(editor.value)
  if (note) { note.content = editor.value; schedSave() }
  scheduleAutoTitle(400)
}

chatLog.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]')
  if (!btn) return
  const m = chatHistory[+btn.dataset.idx]
  if (!m || m.role !== 'assistant') return
  applyAssistantText(m.text, btn.dataset.act)
})

async function setAiOpen(open) {
  aiOpen = open
  card.classList.toggle('ai-open', open)
  if (note) {
    const r = await window.api.setAiMode(note.id, open)
    if (r?.ok) syncLayoutState(r)
  }
  if (open) setTimeout(() => aiInput.focus(), 200)
}

aiToggle.addEventListener('click', () => setAiOpen(true))
aiClose.addEventListener('click', () => setAiOpen(false))

document.querySelectorAll('.quick-chip').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation()
    aiInput.value = btn.dataset.p
    if (!aiOpen) setAiOpen(true)
    setTimeout(runAI, 40)
  })
})

aiInput.addEventListener('input', () => {
  aiInput.style.height = 'auto'
  aiInput.style.height = Math.min(aiInput.scrollHeight, 88) + 'px'
})

async function runAI() {
  const prompt = aiInput.value.trim()
  if (!prompt || !note) return
  if (!aiOpen) await setAiOpen(true)

  chatHistory.push({ role: 'user', text: prompt })
  chatHistory.push({ role: 'assistant', text: '', streaming: true })
  const assistantIdx = chatHistory.length - 1
  renderChat()

  aiSend.disabled = true
  aiInput.value = ''
  aiInput.style.height = 'auto'

  let gotStream = false
  const offChunk = window.api.onAiStreamChunk(({ text }) => {
    gotStream = true
    chatHistory[assistantIdx].text = text
    updateStreamText(assistantIdx)
  })

  try {
    const result = await window.api.aiGenerate({ prompt, context: editor.value.trim() || null })
    offChunk()

    if (result.error) {
      chatHistory.splice(assistantIdx, 1)
      chatHistory.push({ role: 'error', text: result.error })
      renderChat()
      return
    }

    const finalText = (result.text || '').trim()
    if (!gotStream && finalText) {
      await revealTypewriter(assistantIdx, finalText)
    } else {
      chatHistory[assistantIdx].text = finalText
    }
    chatHistory[assistantIdx].streaming = false
    renderChat()
  } catch (err) {
    offChunk()
    chatHistory.splice(assistantIdx, 1)
    chatHistory.push({ role: 'error', text: err.message || '生成失败' })
    renderChat()
  } finally {
    aiSend.disabled = false
  }
}

aiSend.addEventListener('click', runAI)
aiInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runAI() }
  if (e.key === 'Escape') {
    if (modalOverlay.classList.contains('open')) { modalOverlay.classList.remove('open'); return }
    if (aiOpen) setAiOpen(false)
  }
})

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return
  if (e.target === editor || e.target === aiInput) return
  if (modalOverlay.classList.contains('open')) { modalOverlay.classList.remove('open'); return }
  if (aiOpen) { setAiOpen(false); return }
})

// ── 初始化 ────────────────────────────────────────────────────────────────────
window.api.initNote(n=>{
  note=n
  editor.value   = n.content  || ''
  inpProj.value  = n.project  || ''
  inpCategory.value = n.category || ''
  inpOkfTags.value = (n.okfTags || []).join(', ')
  syncCategoryHint()
  titleManual    = n.projectManual ?? !!n.project?.trim()
  setVersion(n.version || '0.1')
  setFavorite(n.favorite || false)
  btnPromote.textContent = '收入库'
  btnPromote.classList.remove('done')
  if (n.sections) setSectionsUI(n.sections)
  else if (n.editorMode === 'structured') setSectionsUI(parseSectionsToUI(n.content))
  editorMode = n.editorMode || 'free'
  modeFree.classList.toggle('active', editorMode !== 'structured')
  modeStruct.classList.toggle('active', editorMode === 'structured')
  sectionsWrap.classList.toggle('visible', editorMode === 'structured')
  editorWrap.classList.toggle('hidden-mode', editorMode === 'structured')
  updateCounts()
  saveTime.textContent = relTime(n.updatedAt||n.createdAt)
  btnPin.classList.toggle('on', n.pinned!==false)
  if (n.aiOpen) {
    aiOpen = true
    card.classList.add('ai-open')
  }
  updateCopyCount()
  updateVarBar(editor.value)
  const empty=!n.content?.trim(), noName=!n.project?.trim()
  if (n.content?.trim() && !n.project?.trim()) scheduleAutoTitle(600)
  if(empty&&noName) setTimeout(()=>inpProj.focus(),80)
  else if(empty)    setTimeout(()=>editor.focus(),80)
})
setInterval(()=>{ if(note&&footerM.className==='footer-meta') saveTime.textContent=relTime(note.updatedAt||note.createdAt) }, 20000)
</script>
