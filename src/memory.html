<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>KnowMe — 近期记忆</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-page:#f3f1ec;--bg-card:#ffffff;--bg-top:#f8f7f4;--div:rgba(0,0,0,0.07);
  --text:#1c1917;--text2:#6b6560;--text3:#b0a89e;
  --accent:#3d3a36;--accent-bg:rgba(61,58,54,0.07);--accent-b:rgba(61,58,54,0.20);
  --r:16px;--ui:'Segoe UI Variable','Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,0.04),0 8px 24px rgba(0,0,0,0.06);
}
html,body{width:100%;height:100%;background:var(--bg-page);overflow:hidden;user-select:none;}
.panel{width:100%;height:100%;display:flex;flex-direction:column;background:rgba(255,255,255,.96);border-radius:var(--r);border:1px solid rgba(0,0,0,0.08);box-shadow:var(--shadow);overflow:hidden;}
.header{height:52px;display:flex;align-items:center;padding:0 14px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--div);-webkit-app-region:drag;}
.header-brand{font:600 11px var(--ui);color:var(--text2);flex:1;letter-spacing:.04em;text-transform:uppercase;}
.hbtn{width:22px;height:22px;background:transparent;border:none;border-radius:6px;color:var(--text3);cursor:pointer;-webkit-app-region:no-drag;}
.list-wrap{flex:1;overflow-y:auto;padding:10px 12px 12px;background:linear-gradient(180deg,rgba(243,241,236,.55),transparent 22%);}
.mem-row{padding:11px 12px;border:1px solid rgba(0,0,0,0.05);border-radius:12px;background:rgba(255,255,255,.88);cursor:pointer;transition:background .1s,border-color .1s,transform .1s;}
.mem-row+.mem-row{margin-top:8px;}
.mem-row:hover{background:rgba(61,58,54,0.04);border-color:rgba(61,58,54,0.12);transform:translateY(-1px);}
.mem-kind{font:600 9px var(--ui);color:var(--accent);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.mem-summary{font:12px/1.5 var(--ui);color:var(--text);}
.mem-time{font:10px var(--ui);color:var(--text3);margin-top:5px;}
.empty{padding:40px 20px;text-align:center;font:italic 12px/1.7 var(--ui);color:var(--text3);}
.footer{border-top:1px solid var(--div);padding:10px 14px;background:rgba(255,255,255,.94);font:10px/1.5 var(--ui);color:var(--text3);}
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <span class="header-brand">KnowMe / 近期记忆</span>
    <button class="hbtn" id="btnClose" title="关闭">✕</button>
  </div>
  <div class="list-wrap" id="listWrap"></div>
  <div class="footer">仅保存在本机，不写入云端 · 点击记录可返回对应笔记</div>
</div>
<script src="lib/ui-kit.js?v=1"></script>
<script>
const relTime = (iso) => window.UIKit?.relativeTimeCompact?.(iso, '—') || '—'
const esc = (value) => window.UIKit?.escapeHtml?.(value) || ''

function render(items) {
  const wrap = document.getElementById('listWrap')
  if (!items?.length) {
    wrap.innerHTML = '<div class="empty">暂无使用记录<br>打开、复制或 AI 生成后会出现在这里</div>'
    return
  }
  wrap.innerHTML = [...items].reverse().map(r => {
    const noteId = r.meta?.noteId
    const clickable = noteId ? ` data-note="${noteId}"` : ''
    return `<div class="mem-row"${clickable}>
      <div class="mem-kind">${esc(r.kind || 'habit')}</div>
      <div class="mem-summary">${esc(r.summary || '')}</div>
      <div class="mem-time">${relTime(r.ts)}</div>
    </div>`
  }).join('')
  wrap.querySelectorAll('[data-note]').forEach(el => {
    el.addEventListener('click', () => {
      window.api.focusNote(el.dataset.note)
      window.close()
    })
  })
}

window.api.initMemory(items => render(items))
document.getElementById('btnClose').addEventListener('click', () => window.close())
document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close() })
</script>
</body>
</html>
