<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Sticky-Notes — 使用记忆</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-card:#ffffff;--bg-top:#f8f7f4;--div:rgba(0,0,0,0.07);
  --text:#1c1917;--text2:#6b6560;--text3:#b0a89e;
  --accent:#5558e8;--accent-bg:rgba(85,88,232,0.07);--accent-b:rgba(85,88,232,0.20);
  --r:16px;--ui:'Segoe UI Variable','Segoe UI',system-ui,sans-serif;
}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;}
.panel{width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg-card);border-radius:var(--r);border:1px solid rgba(0,0,0,0.09);box-shadow:0 6px 20px rgba(0,0,0,0.08);overflow:hidden;}
.header{height:44px;display:flex;align-items:center;padding:0 12px;background:var(--bg-top);border-bottom:1px solid var(--div);-webkit-app-region:drag;}
.header-brand{font:600 11px var(--ui);color:var(--text2);flex:1;}
.hbtn{width:22px;height:22px;background:transparent;border:none;border-radius:6px;color:var(--text3);cursor:pointer;-webkit-app-region:no-drag;}
.list-wrap{flex:1;overflow-y:auto;padding:6px 0;}
.mem-row{padding:10px 14px;border-bottom:1px solid rgba(0,0,0,0.04);cursor:pointer;transition:background .1s;}
.mem-row:hover{background:rgba(85,88,232,0.04);}
.mem-kind{font:600 9px var(--ui);color:var(--accent);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.mem-summary{font:12px/1.45 var(--ui);color:var(--text);}
.mem-time{font:10px var(--ui);color:var(--text3);margin-top:4px;}
.empty{padding:40px;text-align:center;font:italic 12px var(--ui);color:var(--text3);}
.footer{border-top:1px solid var(--div);padding:8px 12px;font:10px var(--ui);color:var(--text3);}
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <span class="header-brand">Sticky-Notes · 使用记忆</span>
    <button class="hbtn" id="btnClose" title="关闭">✕</button>
  </div>
  <div class="list-wrap" id="listWrap"></div>
  <div class="footer">本地记忆，不入云 · 点击可跳转到对应提示词</div>
</div>
<script>
function relTime(iso){if(!iso)return'—';const s=(Date.now()-new Date(iso))/1000;if(s<60)return`${Math.floor(s)}s前`;if(s<3600)return`${Math.floor(s/60)}m前`;if(s<86400)return`${Math.floor(s/3600)}h前`;return`${Math.floor(s/86400)}d前`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function render(items) {
  const wrap = document.getElementById('listWrap')
  if (!items?.length) {
    wrap.innerHTML = '<div class="empty">暂无使用记录<br>打开、复制或 AI 生成后会出现在这里</div>'
    return
  }
  wrap.innerHTML = [...items].reverse().map(r => {
    const noteId = r.meta?.noteId
    const clickable = noteId ? ` data-note="${noteId}"` : ''
    return `<div class="mem-row"${clickable}>
      <div class="mem-kind">${esc(r.kind || 'habit')}</div>
      <div class="mem-summary">${esc(r.summary || '')}</div>
      <div class="mem-time">${relTime(r.ts)}</div>
    </div>`
  }).join('')
  wrap.querySelectorAll('[data-note]').forEach(el => {
    el.addEventListener('click', () => {
      window.api.focusNote(el.dataset.note)
      window.close()
    })
  })
}

window.api.initMemory(items => render(items))
document.getElementById('btnClose').addEventListener('click', () => window.close())
document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close() })
</script>
</body>
</html>
