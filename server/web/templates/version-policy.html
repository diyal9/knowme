<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>版本策略 · KnowMe</title><link rel="stylesheet" href="/admin/static/admin.css"></head><body><header><strong>KnowMe 管理后台</strong><span class="muted">{{.User.Username}}</span><nav><a href="/admin/dashboard">概览</a><a href="/admin/usage">用量</a><a href="/admin/announcements">公告</a><a class="active" href="/admin/version-policy">版本</a></nav></header><main><div class="card"><h1>版本策略</h1><form method="post" action="/admin/version-policy"><label>最新版本</label><input name="latest_version" value="{{.Policy.LatestVersion}}"><label>最低支持版本</label><input name="minimum_version" value="{{.Policy.MinimumVersion}}"><label>下载地址</label><input name="download_url" value="{{.Policy.DownloadURL}}"><label>Release Notes</label><textarea name="release_notes" rows="8">{{.Policy.ReleaseNotes}}</textarea><label><input type="checkbox" name="force_update" {{if .Policy.ForceUpdate}}checked{{end}}> 强制升级</label><button class="btn" type="submit">保存</button></form>{{if .Saved}}<p class="ok">已保存</p>{{end}}{{if .Error}}<p class="err">{{.Error}}</p>{{end}}</div></main></body></html>
