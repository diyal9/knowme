<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>审计日志 · KnowMe</title><link rel="stylesheet" href="/admin/static/admin.css"></head><body><header><div class="brand-mark">K</div><div><strong>KnowMe / 控制台</strong><span class="eyebrow">运营与服务管理</span></div><nav><a href="/admin/dashboard">概览</a><a href="/admin/activation-codes">授权</a><a href="/admin/models">模型</a><a href="/admin/usage">用量</a><a class="active" href="/admin/audit">审计</a><a href="/admin/config">配置</a><form method="post" action="/admin/logout"><button class="btn secondary" type="submit">退出</button></form></nav></header><main><div class="page-heading"><div><span class="eyebrow">安全与可追溯性</span><h1>审计日志</h1><p class="lede">记录服务端 API 的访问结果，帮助定位授权、模型和运营操作问题。</p></div></div><div class="card table-card"><div class="table-toolbar"><div><h2>最近 100 条请求</h2><span class="muted">只读记录 · 自动写入</span></div></div><table><thead><tr><th>时间</th><th>方法</th><th>路径</th><th>状态</th><th>Request ID</th></tr></thead><tbody>{{range .Items}}<tr><td class="mono">{{.CreatedAt}}</td><td><span class="method">{{.Method}}</span></td><td class="mono">{{.Path}}</td><td><span class="status status-{{if ge .Status 400}}bad{{else}}good{{end}}">{{.Status}}</span></td><td class="mono muted">{{.RequestID}}</td></tr>{{else}}<tr><td colspan="5" class="empty">暂无审计记录</td></tr>{{end}}</tbody></table></div></main></body></html>
{{template "sidebar" .}}
