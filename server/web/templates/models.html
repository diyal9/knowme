<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>模型 · KnowMe</title><link rel="stylesheet" href="/admin/static/admin.css"></head>
<body><header><strong>KnowMe 管理后台</strong><span class="muted">{{.User.Username}}</span><nav><a href="/admin/dashboard">概览</a><a href="/admin/activation-codes">授权码</a><a class="active" href="/admin/models">模型</a><a href="/admin/config">配置</a><a href="/admin/users">用户</a></nav></header><main><div class="card"><h1>新增或更新模型</h1><form method="post" action="/admin/models"><div class="row"><div><label>ID</label><input name="id" placeholder="qwen-plus" required></div><div><label>显示名称</label><input name="label" placeholder="Qwen Plus" required></div></div><div class="row"><div><label>Provider</label><input name="provider" placeholder="dashscope" required></div><div><label>所需套餐</label><input name="required_plan" placeholder="留空表示公共" ></div></div><div class="row"><div><label>上下文窗口</label><input name="context_window" type="number" value="32768"></div><div><label>最大输出</label><input name="max_output" type="number" value="4096"></div></div><label><input name="supports_tools" type="checkbox" checked> 支持工具</label><label><input name="enabled" type="checkbox" checked> 启用</label><button class="btn" type="submit">保存模型</button></form>{{if .Saved}}<p class="ok">已保存</p>{{end}}{{if .Error}}<p class="err">{{.Error}}</p>{{end}}</div><div class="card"><h2>模型目录</h2><table><tr><th>ID</th><th>名称</th><th>Provider</th><th>套餐</th><th>状态</th></tr>{{range .Models}}<tr><td>{{.ID}}</td><td>{{.Label}}</td><td>{{.Provider}}</td><td>{{.RequiredPlan}}</td><td>{{if .Enabled}}启用{{else}}停用{{end}}</td></tr>{{end}}</table></div></main></body></html>
