<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>公告 · KnowMe</title><link rel="stylesheet" href="/admin/static/admin.css"></head><body><header><strong>KnowMe 管理后台</strong><span class="muted">{{.User.Username}}</span><nav><a href="/admin/dashboard">概览</a><a href="/admin/usage">用量</a><a class="active" href="/admin/announcements">公告</a><a href="/admin/version-policy">版本</a></nav></header><main><div class="card"><h1>发布公告</h1><form method="post" action="/admin/announcements"><label>标题</label><input name="title" required><label>正文</label><textarea name="body" rows="5" required></textarea><label>级别</label><select name="level"><option value="info">普通</option><option value="warning">重要</option><option value="maintenance">维护</option></select><label>最低版本（可选）</label><input name="min_version"><label><input type="checkbox" name="published" checked> 立即发布</label><button class="btn" type="submit">保存</button></form>{{if .Saved}}<p class="ok">已保存</p>{{end}}{{if .Error}}<p class="err">{{.Error}}</p>{{end}}</div><div class="card"><h2>公告列表</h2>{{range .Items}}<article><h3>{{.Title}}</h3><p>{{.Body}}</p><span class="muted">{{.Level}} · {{.CreatedAt}}</span></article>{{else}}<p class="muted">暂无公告。</p>{{end}}</div></main></body></html>
