<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>授权码 · KnowMe</title><link rel="stylesheet" href="/admin/static/admin.css"></head>
<body><header><strong>KnowMe 管理后台</strong><span class="muted">{{.User.Username}}</span><nav><a href="/admin/dashboard">概览</a><a class="active" href="/admin/activation-codes">授权码</a><a href="/admin/models">模型</a><a href="/admin/config">配置</a><a href="/admin/users">用户</a></nav></header><main><div class="card"><h1>生成授权码</h1><form method="post" action="/admin/activation-codes"><label>套餐</label><select name="plan_id">{{range .Plans}}<option value="{{.ID}}">{{.Name}}（{{.ID}}）</option>{{end}}</select><label>数量</label><input name="count" type="number" min="1" max="1000" value="1"><button class="btn" type="submit">生成</button></form>{{if .Error}}<p class="err">{{.Error}}</p>{{end}}</div>{{if .Codes}}<div class="card"><h2>请立即保存以下授权码</h2>{{range .Codes}}<code style="display:block;margin:8px 0">{{.}}</code>{{end}}</div>{{end}}</main></body></html>
